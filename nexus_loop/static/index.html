<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f1efe8">
  <meta name="description" content="Nexus Loop operator decision surface">
  <title>Nexus Loop — operator review</title>
  <style>
    :root {
      --paper: #f1efe8;
      --paper-deep: #e8e5dc;
      --sheet: #fbfaf6;
      --ink: #1d1e1b;
      --muted: #686a64;
      --faint: #989a93;
      --line: #d7d4ca;
      --line-dark: #aaa79e;
      --accent: #e94f2f;
      --accent-dark: #ba321b;
      --accent-soft: #f9dcd3;
      --shadow: 0 18px 55px rgba(32, 31, 27, .08);
      --display: Georgia, "Times New Roman", serif;
      --chrome: "Arial Nova", "Helvetica Neue", Arial, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --max: 1240px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(29, 30, 27, .025) 1px, transparent 1px) 0 0 / 100% 32px,
        var(--paper);
      font-family: var(--chrome);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    .num, code, .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: -.025em;
    }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .skip {
      position: fixed;
      z-index: 100;
      left: 1rem;
      top: -5rem;
      padding: .7rem 1rem;
      color: #fff;
      background: var(--accent-dark);
      border-radius: 999px;
      text-decoration: none;
    }
    .skip:focus { top: 1rem; }

    .topbar {
      position: sticky;
      z-index: 30;
      top: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 66px;
      padding: 0 max(24px, calc((100vw - var(--max)) / 2));
      border-bottom: 1px solid rgba(29, 30, 27, .12);
      background: rgba(241, 239, 232, .93);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: max-content;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .15em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .brand-mark {
      position: relative;
      width: 22px;
      height: 22px;
      border: 2px solid var(--ink);
      border-radius: 50%;
    }
    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: var(--accent);
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 5px;
      right: -4px;
      top: 1px;
      background: var(--paper);
      border-top: 2px solid var(--ink);
      transform: rotate(-28deg);
    }
    .global-nav { display: flex; align-items: center; gap: 4px; }
    .nav-link {
      padding: 9px 14px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      text-decoration: none;
    }
    .nav-link:hover, .nav-link[aria-current="page"] { color: var(--ink); background: var(--sheet); }
    .run-tools { display: flex; justify-content: flex-end; align-items: center; gap: 12px; min-width: 0; }
    .run-label {
      overflow: hidden;
      max-width: 180px;
      color: var(--muted);
      font: 11px/1.2 var(--mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gen-wrap { display: flex; align-items: center; gap: 8px; }
    .btn-gen {
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line-dark);
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
    }
    .btn-gen:hover { border-color: var(--ink); background: var(--sheet); }
    .btn-gen:disabled { cursor: wait; opacity: .45; }
    .gen-flash { color: var(--muted); font-size: 11px; }
    .gen-flash.err { color: var(--accent-dark); }
    .gen-flash.ok { color: var(--ink); }

    #app { min-height: calc(100vh - 66px); }
    .view { animation: enter .42s cubic-bezier(.2,.8,.2,1) both; }
    .page { width: min(calc(100% - 48px), var(--max)); margin: 0 auto; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .display {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: .98;
      text-wrap: balance;
    }
    .lede { color: var(--muted); font-size: 16px; line-height: 1.6; }
    .primary, .secondary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }
    .primary { color: #fff; background: var(--accent); }
    .primary:hover { background: var(--accent-dark); transform: translateY(-2px); }
    .primary .arrow { font: 18px/1 var(--mono); }
    .secondary-link { min-height: 40px; padding: 0 15px; color: var(--accent-dark); background: transparent; }
    .secondary-link:hover { color: #fff; background: var(--accent); }

    /* Landing */
    .landing { padding: clamp(48px, 8vh, 84px) 0 30px; }
    .landing-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(270px, .6fr);
      gap: clamp(38px, 8vw, 110px);
      align-items: end;
      margin-bottom: clamp(38px, 6vh, 64px);
    }
    .landing h1 { max-width: 850px; font-size: clamp(54px, 7.2vw, 102px); }
    .hero-side { padding: 0 0 7px; }
    .hero-side .lede { margin: 0 0 24px; max-width: 35ch; }
    .hero-note {
      margin: 15px 0 0;
      color: var(--muted);
      font: 11px/1.5 var(--mono);
    }
    .timeline-shell {
      position: relative;
      overflow: hidden;
      padding: 22px 24px 18px;
      border: 1px solid var(--line-dark);
      border-radius: 18px;
      background: rgba(251, 250, 246, .7);
      box-shadow: var(--shadow);
    }
    .timeline-head { display: flex; justify-content: space-between; gap: 20px; align-items: baseline; }
    .timeline-head h2 { margin: 0; font: 400 clamp(23px, 2.2vw, 32px)/1.1 var(--display); letter-spacing: -.03em; }
    .timeline-head p { margin: 0; color: var(--muted); font: 11px/1.4 var(--mono); }
    .timeline { display: block; width: 100%; height: auto; margin-top: 12px; overflow: visible; }
    .timeline text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
    .timeline .lane-label { fill: var(--ink); font-family: var(--chrome); font-size: 11px; font-weight: 700; }
    .timeline .axis { stroke: var(--line-dark); stroke-width: 1; stroke-dasharray: 900; animation: draw 1.2s ease-out both; }
    .timeline .tick { stroke: var(--line); stroke-width: 1; }
    .timeline .window { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
    .timeline a:hover .window, .timeline a:focus .window { fill: var(--accent); }
    .timeline a:hover .window-text, .timeline a:focus .window-text { fill: #fff; }
    .timeline .window-text { fill: var(--accent-dark); font-weight: 800; }
    .timeline .change-line { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; }
    .timeline .change-dot { fill: var(--sheet); stroke: var(--ink); stroke-width: 2; }
    .timeline .pulse { transform-box: fill-box; transform-origin: center; animation: pulse-once 1.1s .6s ease-out both; }
    .timeline-empty { padding: 70px 0; color: var(--muted); text-align: center; }
    .status-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      margin-top: 22px;
      border-top: 1px solid var(--line-dark);
      border-bottom: 1px solid var(--line-dark);
    }
    .status-item { position: relative; padding: 16px 18px 14px; }
    .status-item + .status-item::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 1px; background: var(--line); }
    .status-item .value { display: block; font: 600 19px/1.1 var(--mono); animation: settle .55s .1s ease-out both; }
    .status-item .label { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .framing { margin: 20px 0 0; color: var(--muted); font: 12px/1.5 var(--mono); text-align: center; }

    /* Dashboard */
    .dashboard { padding: 52px 0 80px; }
    .dash-title { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: end; margin-bottom: 36px; }
    .dash-title h1 { max-width: 820px; font-size: clamp(48px, 6vw, 80px); }
    .dash-title .lede { max-width: 31ch; margin: 0 0 3px; }
    .kpi-band {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      margin-bottom: 42px;
      border: 1px solid var(--line-dark);
      border-radius: 14px;
      background: rgba(251,250,246,.55);
    }
    .kpi-band .status-item { padding: 18px 20px; }
    .section-head { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin: 0 0 16px; }
    .section-head h2 { margin: 0; font: 400 30px/1.1 var(--display); letter-spacing: -.03em; }
    .section-head p { margin: 0; color: var(--muted); font: 11px/1.5 var(--mono); }
    .dash-timeline { margin-bottom: 42px; box-shadow: none; background: transparent; }
    .fault-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 52px; }
    .fault-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 390px;
      padding: 22px;
      border: 1px solid var(--line-dark);
      border-radius: 16px;
      background: var(--sheet);
      box-shadow: 0 10px 30px rgba(29,30,27,.04);
    }
    .fault-card::before { content: ""; position: absolute; left: 22px; top: 0; width: 46px; height: 3px; background: var(--accent); }
    .fault-top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .fault-index { color: var(--accent-dark); font: 11px/1 var(--mono); }
    .severity { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .fault-card h3 { margin: 0 0 14px; font: 400 26px/1.08 var(--display); letter-spacing: -.03em; text-wrap: balance; }
    .fault-slice { margin: 0 0 22px; color: var(--muted); font: 11px/1.45 var(--mono); overflow-wrap: anywhere; }
    .fault-compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; padding: 15px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .fault-compare span { display: block; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .fault-compare strong { display: block; margin-top: 4px; font: 600 21px/1 var(--mono); }
    .fault-compare i { padding-bottom: 4px; color: var(--accent); font-style: normal; }
    .harm-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 17px 0; }
    .harm { min-width: 0; }
    .harm strong { display: block; overflow-wrap: anywhere; font: 600 15px/1.2 var(--mono); }
    .harm span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.25; text-transform: uppercase; }
    .fault-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: auto; color: var(--muted); font-size: 10px; font-weight: 700; }
    .fault-meta .verified { color: var(--accent-dark); }
    .fault-link { display: inline-flex; align-items: center; gap: 7px; margin-top: 17px; color: var(--ink); font-size: 11px; font-weight: 800; text-decoration: none; }
    .fault-link:hover { color: var(--accent-dark); }
    .empty-card { grid-column: 1 / -1; padding: 50px; border: 1px dashed var(--line-dark); border-radius: 16px; color: var(--muted); text-align: center; }
    .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .board {
      min-width: 0;
      padding: 22px;
      border-top: 1px solid var(--line-dark);
      background: rgba(251,250,246,.38);
    }
    .board.wide { grid-column: 1 / -1; }
    .board h3 { margin: 0 0 16px; font: 400 24px/1.15 var(--display); letter-spacing: -.025em; }
    .board-list { list-style: none; margin: 0; padding: 0; }
    .board-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 11px 0;
      border-top: 1px solid var(--line);
    }
    .board-row:first-child { border-top: 0; }
    .board-row .symbol { color: var(--accent); font: 16px/1 var(--mono); }
    .board-row strong { display: block; font-size: 12px; line-height: 1.35; }
    .board-row small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .board-row .tag { color: var(--muted); font: 10px/1.3 var(--mono); text-align: right; }
    .question-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 28px; }
    .question {
      display: grid;
      grid-template-columns: 34px minmax(0,1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 46px;
      border-top: 1px solid var(--line);
    }
    .question .ask { color: var(--accent-dark); font: 10px/1 var(--mono); }
    .question strong { font-size: 11px; }
    .question .answer { color: var(--muted); font: 9px/1.2 var(--mono); text-align: right; }
    .fidelity-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
    .fidelity-item { padding: 14px; border: 1px solid var(--line); border-radius: 10px; }
    .fidelity-item strong { display: block; font-size: 11px; }
    .fidelity-item span { display: block; margin-top: 5px; color: var(--muted); font: 10px/1.4 var(--mono); }

    /* Case file */
    .case { padding: 34px 0 90px; }
    .case-back { display: inline-flex; gap: 8px; align-items: center; margin-bottom: 30px; color: var(--muted); font-size: 11px; font-weight: 800; text-decoration: none; }
    .case-back:hover { color: var(--ink); }
    .case-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr);
      gap: clamp(36px, 7vw, 96px);
      align-items: start;
      padding: 32px 0 48px;
      border-top: 1px solid var(--line-dark);
      border-bottom: 1px solid var(--line-dark);
    }
    .case-hero h1 { max-width: 780px; font-size: clamp(48px, 6vw, 82px); }
    .case-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 22px 0 0; color: var(--muted); font: 11px/1.4 var(--mono); }
    .case-meta span:first-child { color: var(--accent-dark); }
    .action-card { padding: 24px; border-radius: 15px; color: #fff; background: var(--ink); box-shadow: var(--shadow); }
    .action-card .eyebrow { color: #f4a491; }
    .action-card h2 { margin: 0 0 14px; font: 400 23px/1.16 var(--display); letter-spacing: -.025em; }
    .action-card p { margin: 0 0 22px; color: #cacbc5; font-size: 12px; }
    .action-card .primary { width: 100%; }
    .impact-block { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; margin: 42px 0; }
    .impact-lead {
      display: grid;
      grid-template-columns: .7fr 1.3fr;
      gap: 24px;
      padding: 28px;
      border-radius: 16px;
      color: #fff;
      background: var(--accent);
    }
    .impact-big strong { display: block; font: 600 clamp(42px, 5vw, 70px)/.95 var(--mono); letter-spacing: -.08em; }
    .impact-big span { display: block; margin-top: 10px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .impact-copy { align-self: end; }
    .impact-copy p { margin: 0; font-family: var(--display); font-size: 22px; line-height: 1.25; }
    .impact-copy small { display: block; margin-top: 12px; color: rgba(255,255,255,.75); font: 10px/1.5 var(--mono); }
    .harm-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; overflow: hidden; border: 1px solid var(--line-dark); border-radius: 16px; background: var(--line); }
    .harm-panel .harm { padding: 20px; background: var(--sheet); }
    .harm-panel .harm strong { font-size: 22px; }
    .harm-panel .harm span { margin-top: 7px; }
    .derive { margin-top: 12px; }
    details.disclosure { border-top: 1px solid var(--line); }
    details.disclosure summary {
      padding: 14px 0;
      cursor: pointer;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      list-style: none;
    }
    details.disclosure summary::-webkit-details-marker { display: none; }
    details.disclosure summary::after { content: "+"; float: right; color: var(--accent-dark); font: 16px/1 var(--mono); }
    details.disclosure[open] summary::after { content: "−"; }
    .disclosure-body { padding: 0 0 18px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .disclosure-body p { margin: 0 0 12px; }
    .case-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 18px 0 40px; }
    .case-card { min-width: 0; padding: 24px; border: 1px solid var(--line-dark); border-radius: 16px; background: rgba(251,250,246,.62); }
    .case-card h2 { margin: 0 0 8px; font: 400 27px/1.15 var(--display); letter-spacing: -.03em; }
    .case-card > p { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
    .config-line { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; margin: 18px 0; padding: 14px; border-left: 3px solid var(--accent); background: var(--sheet); }
    .config-day { color: var(--accent-dark); font: 600 12px/1.4 var(--mono); }
    .config-line strong { display: block; font-size: 12px; }
    .config-line small { color: var(--muted); font: 10px/1.5 var(--mono); }
    .bar-chart { display: grid; gap: 12px; margin: 18px 0; }
    .bar-row { display: grid; grid-template-columns: minmax(90px, .7fr) 2fr auto; gap: 12px; align-items: center; }
    .bar-label { color: var(--muted); font-size: 10px; font-weight: 800; }
    .bar-track { height: 8px; border-radius: 99px; background: var(--paper-deep); overflow: hidden; }
    .bar-fill { display: block; height: 100%; border-radius: 99px; background: var(--ink); transform-origin: left; animation: bar-in .7s ease-out both; }
    .bar-row.observed .bar-fill { background: var(--accent); }
    .bar-value { min-width: 54px; font: 600 11px/1 var(--mono); text-align: right; }
    .replay-stamp { display: flex; gap: 14px; align-items: center; margin: 18px 0; padding: 14px; border: 1px solid var(--accent); border-radius: 12px; }
    .replay-stamp .seal { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto; border-radius: 50%; color: #fff; background: var(--accent); font: 700 17px/1 var(--mono); }
    .replay-stamp strong { display: block; font-size: 12px; }
    .replay-stamp small { display: block; margin-top: 3px; color: var(--muted); font: 10px/1.4 var(--mono); }
    .evidence-list { margin: 0; padding-left: 18px; }
    .evidence-list li + li { margin-top: 8px; }
    .decision-wrap { display: grid; grid-template-columns: .72fr 1.28fr; gap: 48px; padding-top: 42px; border-top: 1px solid var(--line-dark); }
    .decision-intro h2 { margin: 0 0 12px; font: 400 38px/1.05 var(--display); letter-spacing: -.04em; }
    .decision-intro p { color: var(--muted); font-size: 12px; }
    .gate-col { min-width: 0; padding: 26px; border: 1px solid var(--line-dark); border-radius: 16px; background: var(--sheet); box-shadow: var(--shadow); }
    .gate-col .ask { margin: 0 0 18px; font: 400 22px/1.3 var(--display); }
    .risk { color: var(--muted); font-size: 12px; }
    .field { display: block; margin: 18px 0 7px; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .input { width: 100%; min-height: 94px; padding: 13px; resize: vertical; border: 1px solid var(--line-dark); border-radius: 9px; color: var(--ink); background: #fff; }
    .input[aria-invalid="true"] { border-color: var(--accent); }
    .btn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .btn { min-height: 46px; border: 1px solid var(--line-dark); border-radius: 9px; cursor: pointer; font-size: 11px; font-weight: 800; }
    .btn:disabled { cursor: wait; opacity: .5; }
    .btn-ok { color: #fff; border-color: var(--ink); background: var(--ink); }
    .btn-bad { color: var(--accent-dark); border-color: var(--accent); background: transparent; }
    .btn-ghost { color: var(--muted); background: transparent; }
    .btn:hover { transform: translateY(-1px); }
    .flash { min-height: 20px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .flash.err { color: var(--accent-dark); }
    .alert { margin-bottom: 18px; padding: 14px; border-left: 3px solid var(--accent); background: var(--paper); }
    .alert p { margin: 0; font-size: 12px; }
    .alert p + p { margin-top: 5px; color: var(--muted); }
    .idle { margin: 0; color: var(--muted); font-size: 12px; }
    .tech-foot { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
    .tech-head { margin: 0 0 8px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .tech-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tech-list code { padding: 4px 7px; border-radius: 5px; color: var(--muted); background: var(--paper); font-size: 9px; }
    .honesty { margin: 0; }
    .honesty summary { cursor: pointer; color: var(--muted); font-size: 10px; font-weight: 800; }
    .honesty-copy { margin-top: 8px; max-height: 180px; overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--paper); font-size: 10px; white-space: pre-line; }
    .case-state { max-width: 760px; margin: 50px auto; padding: 36px; border: 1px solid var(--line-dark); border-radius: 16px; background: var(--sheet); }
    .case-state h1 { font-size: clamp(40px, 5vw, 64px); }
    .case-state .lede { margin-bottom: 24px; }
    .compat-hook {
      position: absolute;
      left: -10000px;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      pointer-events: none;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      width: min(calc(100% - 48px), var(--max));
      margin: 0 auto;
      padding: 22px 0 28px;
      border-top: 1px solid var(--line-dark);
      color: var(--muted);
      font: 10px/1.5 var(--mono);
    }

    @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes draw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
    @keyframes pulse-once { 0% { transform: scale(.98); opacity: .45; } 45% { transform: scale(1.02); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes settle { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @keyframes bar-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    @media (max-width: 920px) {
      .topbar { grid-template-columns: 1fr auto; padding: 0 18px; }
      .global-nav { grid-row: 2; grid-column: 1 / -1; justify-content: center; padding: 4px 0 8px; }
      .run-label { display: none; }
      #app { min-height: calc(100vh - 104px); }
      .landing-hero, .dash-title, .case-hero, .impact-block, .decision-wrap { grid-template-columns: 1fr; }
      .hero-side { max-width: 520px; }
      .status-row, .kpi-band { grid-template-columns: repeat(3, 1fr); }
      .status-item:nth-child(4)::before { display: none; }
      .fault-grid { grid-template-columns: 1fr; }
      .fault-card { min-height: 0; }
      .boards, .case-grid { grid-template-columns: 1fr; }
      .board.wide { grid-column: auto; }
      .case-hero { gap: 28px; }
      .action-card { max-width: 580px; }
      .decision-wrap { gap: 22px; }
    }

    @media (max-width: 600px) {
      body { font-size: 14px; }
      .page, .footer { width: min(calc(100% - 28px), var(--max)); }
      .topbar { min-height: 58px; }
      .brand { font-size: 10px; }
      .brand-mark { width: 19px; height: 19px; }
      .btn-gen { min-height: 31px; padding: 0 10px; font-size: 10px; }
      .gen-flash { display: none; }
      .nav-link { padding: 7px 12px; font-size: 11px; }
      .landing { padding-top: 44px; }
      .landing h1, .dash-title h1, .case-hero h1 { font-size: clamp(44px, 14vw, 62px); }
      .landing-hero { gap: 25px; margin-bottom: 34px; }
      .hero-side .lede { font-size: 14px; }
      .primary { width: 100%; }
      .timeline-shell { padding: 17px 14px 12px; border-radius: 14px; }
      .timeline-head { align-items: start; }
      .timeline-head h2 { font-size: 21px; }
      .timeline-head p { max-width: 11ch; text-align: right; }
      .timeline { width: 720px; max-width: none; }
      .timeline-scroll { overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
      .status-row, .kpi-band { grid-template-columns: repeat(2, 1fr); }
      .status-item:nth-child(odd)::before { display: none; }
      .status-item:nth-child(even)::before { display: block; }
      .status-item { padding: 13px 12px; }
      .status-item .value { font-size: 17px; }
      .framing { text-align: left; }
      .dashboard { padding-top: 38px; }
      .dash-title { margin-bottom: 25px; }
      .kpi-band { margin-bottom: 32px; }
      .section-head { align-items: start; }
      .section-head p { max-width: 14ch; text-align: right; }
      .fault-grid { gap: 12px; }
      .fault-card { padding: 19px; }
      .fault-card h3 { font-size: 25px; }
      .boards { gap: 10px; }
      .board { padding: 18px 14px; }
      .question-grid, .fidelity-strip { grid-template-columns: 1fr; }
      .question:nth-child(6) { border-top: 1px solid var(--line); }
      .case { padding-top: 24px; }
      .case-back { margin-bottom: 18px; }
      .case-hero { padding: 24px 0 32px; }
      .action-card { padding: 21px; }
      .action-card h2 { font-size: 20px; line-height: 1.14; }
      .impact-block { margin: 28px 0; }
      .impact-lead { grid-template-columns: 1fr; padding: 22px; }
      .impact-copy { align-self: auto; }
      .harm-panel .harm { padding: 16px; }
      .case-grid { gap: 12px; }
      .case-card { padding: 19px; }
      .decision-wrap { padding-top: 28px; }
      .gate-col { padding: 19px; }
      .btn-row { grid-template-columns: 1fr; }
      .btn { min-height: 48px; }
      .footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
    }
  </style>
  <link rel="stylesheet" href="/signed-copy/signed-copy.css">
  <script src="/signed-copy/contract.js"></script>
  <script src="/signed-copy/template.js"></script>
  <script src="/signed-copy/summary.js"></script>
  <script src="/signed-copy/adapter.js"></script>
  <script src="/signed-copy/ui.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Nexus Loop home"><span class="brand-mark" aria-hidden="true"></span>Nexus Loop</a>
    <nav class="global-nav" aria-label="Primary">
      <a class="nav-link" id="nav-overview" href="#/">Overview</a>
      <a class="nav-link" id="nav-dashboard" href="#/dashboard">Dashboard</a>
    </nav>
    <div class="run-tools">
      <span class="run-label" id="hdr">Loading report…</span>
      <span class="gen-wrap">
        <button type="button" class="btn-gen" id="gen-btn">Generate report</button>
        <span class="gen-flash" id="gen-flash" role="status" aria-live="polite"></span>
      </span>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <div id="app"><div class="page case-state"><p class="idle">Reading <code>loop-report.json</code>…</p></div></div>
  </main>
  <footer class="footer">
    <span>Every figure is copied from the report. No client metric calculation.</span>
    <span>A human decision writes back to the same report.</span>
  </footer>

  <script>
  (function () {
    "use strict";
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value == null ? "" : value).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
    const isNum = (value) => typeof value === "number" && Number.isFinite(value);
    const fmt = (value, digits) => isNum(value)
      ? value.toLocaleString("en-US", { maximumFractionDigits: digits == null ? 2 : digits })
      : "—";
    const pct = (value) => isNum(value) ? (value * 100).toFixed(1) + "%" : "—";
    const money = (value) => isNum(value) ? "$" + value.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
    const human = (value) => String(value || "").replace(/[._]/g, " ");
    const clip = (value, max) => {
      const s = String(value || "").replace(/\s+/g, " ").trim();
      if (s.length <= max) return s;
      const at = s.lastIndexOf(" ", max - 1);
      return s.slice(0, at > 0 ? at : max - 1) + "…";
    };

    const AUDIENCE = { agent_builder: "Agent team", platform_owner: "Platform team", business_owner: "Business owner" };
    const METRIC = { resolution_rate: "Resolution rate", turns_to_resolve: "Turns to resolve", median_turns: "Median turns", tool_p95_latency_ms: "Tool p95 latency", containment_rate: "Containment rate", quality_score: "Quality score" };
    const CAUSE = {
      "tool.contract_break": "The tool returned success with an empty answer",
      "kb.gap": "The knowledge base cannot ground this question",
      "prompt.regression": "The prompt added effort without improving outcomes",
      "traffic_mix": "Traffic mix shifted; quality did not", load: "A short-lived load spike",
      judge_change: "The scorecard changed; the agent did not", unknown: "Cause is not yet known"
    };
    const ASK = { A01: "Handled without a human", A02: "Month-over-month change", A03: "Costliest intent", A04: "Tool failures", A05: "Returns drop-off", A06: "Knowledge quality", A07: "Model upgrade", A08: "Serving spend", A09: "Why users abandoned", A10: "Human review queue", A11: "Failover rate" };
    const GAP_CLAIM = { A11: "We will not invent a failover rate", A09: "We count who left. We will not invent why", A02: "We will not group by a near-unique customer field" };

    function metricLabel(id) { return METRIC[id] || human(id).replace(/^./, (c) => c.toUpperCase()); }
    function causeLabel(id) { return CAUSE[id] || human(id); }
    function audienceLabel(items) { return (items || []).map((x) => AUDIENCE[x] || human(x)).join(" + ") || "Owner not recorded"; }
    function showValue(metric, value) {
      if (!isNum(value)) return "—";
      if (/rate|share|containment|resolution/i.test(String(metric || "")) && value >= 0 && value <= 1) return pct(value);
      return fmt(value, Math.abs(value) < 10 ? 2 : 1);
    }
    function windowLabel(window) {
      if (!window || (window.from_day == null && window.to_day == null)) return "Window not recorded";
      return `Days ${window.from_day == null ? "—" : window.from_day}–${window.to_day == null ? "—" : window.to_day}`;
    }
    function cohortLabel(finding) {
      const cohort = (finding && finding.cohort) || {};
      const parts = [finding && finding.tenant, cohort.intent, cohort.agent_id, cohort.tool].filter(Boolean);
      return parts.length ? parts.join(" / ") : (finding && finding.tenant) || "All traffic";
    }
    function gapClaim(gap) { return GAP_CLAIM[gap && gap.ask_id] || "We will not invent this number"; }
    function fidelityLabel(metric) {
      if (!metric) return "not answered";
      const coverage = metric.coverage && metric.coverage.value;
      return `${metric.fidelity || "unlabelled"}${isNum(coverage) ? ` · ${pct(coverage)} coverage` : ""}`;
    }
    function firstForAsk(report, ask) { return (report.metrics || []).find((m) => m.ask_id === ask); }
    function calibrationMetric(report) { return (report.metrics || []).find((m) => m.calibration && isNum(m.calibration.agreement)); }
    function regressionFindings(report) { return (report.findings || []).filter((f) => f.is_regression); }
    function dismissedFindings(report) { return (report.findings || []).filter((f) => !f.is_regression); }
    function lookup(report, finding) {
      const diagnosis = (report.diagnoses || []).find((d) => d.finding_id === finding.id) || null;
      const prescription = diagnosis && (report.prescriptions || []).find((p) => p.diagnosis_id === diagnosis.id) || null;
      const verification = prescription && (report.verifications || []).find((v) => v.prescription_id === prescription.id) || null;
      const standard = (report.standard || []).find((s) => s.metric === finding.metric && s.tenant === finding.tenant && JSON.stringify(s.cohort || {}) === JSON.stringify(finding.cohort || {}))
        || (report.standard || []).find((s) => s.metric === finding.metric && s.tenant === finding.tenant) || null;
      return { f: finding, d: diagnosis, p: prescription, v: verification, s: standard };
    }
    function findById(report, id) { return (report.findings || []).find((f) => f.id === id) || null; }
    function defaultFinding(report) {
      const verified = (report.verifications || [])[0];
      if (verified) {
        const p = (report.prescriptions || []).find((item) => item.id === verified.prescription_id);
        const d = p && (report.diagnoses || []).find((item) => item.id === p.diagnosis_id);
        const f = d && findById(report, d.finding_id);
        if (f) return f;
      }
      return regressionFindings(report)[0] || (report.findings || [])[0] || null;
    }
    function criticalFinding(report) { return regressionFindings(report).find((f) => f.severity === "critical") || defaultFinding(report); }

    async function api(path, options) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), options && options.timeoutMs || 15000);
      const opts = Object.assign({ headers: { "Content-Type": "application/json" }, signal: controller.signal }, options || {});
      delete opts.timeoutMs;
      try {
        const response = await fetch(path, opts);
        const text = await response.text();
        let data = null;
        try { data = text ? JSON.parse(text) : {}; } catch (_) { data = { detail: text }; }
        if (!response.ok) throw new Error((data && (data.detail || data.error)) || `HTTP ${response.status}`);
        return data;
      } finally { clearTimeout(timer); }
    }

    function route() {
      const raw = location.hash || "#/";
      if (raw === "#" || raw === "#/" || raw === "") return { view: "landing" };
      if (raw === "#/dashboard") return { view: "dashboard" };
      if (raw.startsWith("#/f/")) return { view: "detail", id: decodeURIComponent(raw.slice(4)) };
      if (raw.startsWith("#gap:")) return { view: "gap", id: raw.slice(5) };
      if (raw.startsWith("#") && !raw.startsWith("#/")) return { view: "detail", id: decodeURIComponent(raw.slice(1)) };
      return { view: "landing" };
    }
    function setNav(view) {
      $("nav-overview").toggleAttribute("aria-current", view === "landing");
      $("nav-dashboard").toggleAttribute("aria-current", view === "dashboard" || view === "detail" || view === "gap");
    }
    function statusItems(report) {
      const regs = regressionFindings(report), dismissed = dismissedFindings(report), gaps = report.gaps || [], verified = report.verifications || [];
      const coverageMetric = firstForAsk(report, "A01") || (report.metrics || []).find((m) => m.coverage);
      const calibration = calibrationMetric(report);
      return [[String(regs.length), "regressions"], [String(dismissed.length), "dismissed"], [String(gaps.length), "refused"], [String(verified.length), "verified"], [coverageMetric && coverageMetric.coverage ? pct(coverageMetric.coverage.value) : "—", "coverage"], [calibration ? pct(calibration.calibration.agreement) : "—", "calibration"]];
    }
    function statusRow(report, className) {
      return `<div class="${className || "status-row"}">${statusItems(report).map(([value, label]) => `<div class="status-item"><span class="value num">${esc(value)}</span><span class="label">${esc(label)}</span></div>`).join("")}</div>`;
    }

    function timeline(report, compact) {
      const findings = regressionFindings(report);
      if (!findings.length) return `<div class="timeline-empty">No regression windows in this report.</div>`;
      const width = 1080, left = 185, right = 40, usable = width - left - right, maxDay = 55;
      const x = (day) => left + Math.max(0, Math.min(maxDay, Number(day) || 0)) / maxDay * usable;
      const ticks = [0, 14, 28, 42, 55];
      const rows = findings.map((f, index) => {
        const pack = lookup(report, f), y = 48 + index * 55;
        const start = x(f.window && f.window.from_day), end = x(f.window && f.window.to_day), w = Math.max(12, end - start);
        const change = pack.d && pack.d.attributed_change;
        const marker = change && change.day != null ? `<line class="change-line" x1="${x(change.day)}" y1="${y - 9}" x2="${x(change.day)}" y2="${y + 31}"/><circle class="change-dot" cx="${x(change.day)}" cy="${y - 9}" r="4"/><text x="${x(change.day) + 7}" y="${y - 12}">${esc(change.kind || "change")} · day ${esc(change.day)}</text>` : "";
        return `<a href="#/f/${encodeURIComponent(f.id)}" aria-label="Open ${esc(f.headline || f.id)}"><text class="lane-label" x="0" y="${y + 12}">${esc(clip(f.headline || f.id, 27))}</text><g class="pulse"><rect class="window" x="${start}" y="${y}" width="${w}" height="25" rx="6"/><text class="window-text" x="${start + 8}" y="${y + 17}">${esc(windowLabel(f.window).toLowerCase())}</text></g>${marker}</a>`;
      }).join("");
      return `<div class="timeline-shell${compact ? " dash-timeline" : ""}"><div class="timeline-head"><h2>${compact ? "Fault windows" : "Where the loop broke"}</h2><p>${compact ? "Select a window to open its case file" : `${findings.length} fault windows · configuration changes pinned`}</p></div><div class="timeline-scroll"><svg class="timeline" viewBox="0 0 ${width} 230" role="img" aria-labelledby="timeline-title timeline-desc"><title id="timeline-title">Regression windows over the report period</title><desc id="timeline-desc">Each shaded window comes from a regression finding. Markers come from attributed configuration changes.</desc><line class="axis" x1="${left}" y1="28" x2="${width - right}" y2="28"/>${ticks.map((day) => `<line class="tick" x1="${x(day)}" y1="24" x2="${x(day)}" y2="222"/><text x="${x(day)}" y="17" text-anchor="middle">day ${day}</text>`).join("")}${rows}</svg></div></div>`;
    }

    function honestyBlock(report) {
      const notes = String(report.system_notes || "").trim();
      const coverage = firstForAsk(report, "A01") || (report.metrics || []).find((m) => m.coverage);
      const coverageText = coverage && coverage.coverage && coverage.coverage.value != null ? ` · coverage ${pct(coverage.coverage.value)}` : "";
      return `<details class="honesty" id="honesty"><summary>What is real, stubbed, and simulated${coverageText}</summary><div class="honesty-copy">${esc(notes || "No system note was recorded.")}</div></details>`;
    }

    function renderLanding(report) {
      const regs = regressionFindings(report);
      const headline = regs.length === 0 ? "No active regressions found." : `The agent broke in ${regs.length} places.`;
      return `<div class="view landing page"><section class="landing-hero" aria-labelledby="landing-title"><div><p class="eyebrow">Operator review / ${esc(report.corpus || "unlabelled corpus")}</p><h1 class="display" id="landing-title">${esc(headline)}</h1></div><div class="hero-side"><p class="lede">Trace each failure to the change behind it, review the proposed repair, and leave a reasoned decision in the report.</p><a class="primary" href="#/dashboard">Open incident map <span class="arrow" aria-hidden="true">→</span></a><p class="hero-note">${esc(report.team || "Unknown team")} · generated ${esc(report.generated_at || "time not recorded")}</p></div></section>${timeline(report, false)}${statusRow(report)}<p class="framing">The report separates regressions from convincing lookalikes—and leaves questions unanswered when the evidence cannot support a number.</p><div class="compat-hook" id="gate" aria-hidden="true">Report reloaded.</div></div>`;
    }

    function harmTriplet(finding) {
      const impact = finding.impact || {}, down = impact.downstream || {};
      const candidates = [[impact.conversations_affected, "affected", "count"], [down.would_have_resolved_at_baseline, "lost resolutions", "count"], [down.extra_turns, "extra turns", "count"], [down.unplanned_handoffs, "unplanned handoffs", "count"], [down.abandoned, "abandoned", "count"], [down.excess_cost_usd, "excess cost", "money"], [impact.cost_usd, "recorded cost", "money"]].filter(([value]) => value != null).slice(0, 3);
      while (candidates.length < 3) candidates.push([null, "not recorded", "count"]);
      return candidates;
    }
    function faultCard(report, finding, index) {
      const { p, v } = lookup(report, finding), harms = harmTriplet(finding);
      return `<article class="fault-card"><div class="fault-top"><span class="fault-index">0${index + 1} / ${esc(finding.id)}</span><span class="severity">${esc(finding.severity || "unrated")}</span></div><h3>${esc(finding.headline || metricLabel(finding.metric))}</h3><p class="fault-slice">${esc(cohortLabel(finding))}<br>${esc(windowLabel(finding.window))}</p><div class="fault-compare"><div><span>Observed</span><strong>${esc(showValue(finding.metric, finding.observed))}</strong></div><i>→</i><div><span>Baseline</span><strong>${esc(showValue(finding.metric, finding.expected))}</strong></div></div><div class="harm-row">${harms.map(([value, label, kind]) => `<div class="harm"><strong>${kind === "money" ? esc(money(value)) : esc(fmt(value, 0))}</strong><span>${esc(label)}</span></div>`).join("")}</div><div class="fault-meta"><span>${esc(audienceLabel(finding.audience))}</span><span class="${v ? "verified" : ""}">${v ? esc(`Replay ${v.verdict || "recorded"}`) : p ? "Replay not run" : "No proposed change"}</span></div><a class="fault-link" href="#/f/${encodeURIComponent(finding.id)}">Open case file <span aria-hidden="true">↗</span></a></article>`;
    }

    function dismissedBoard(report) {
      const rows = dismissedFindings(report);
      return `<section class="board"><h3>Dismissed signals</h3><ul class="board-list">${rows.length ? rows.map((f) => `<li class="board-row"><span class="symbol">×</span><span><strong>${esc(f.headline || f.id)}</strong><small>${esc(clip(f.not_a_regression_because || "Marked not a regression in the report.", 92))}</small></span><span class="tag">${esc(windowLabel(f.window))}</span></li>`).join("") : `<li class="board-row"><span class="symbol">—</span><span><strong>No dismissed signals</strong></span></li>`}</ul></section>`;
    }
    function gapsBoard(report) {
      const rows = report.gaps || [];
      return `<section class="board"><h3>Refused measurements</h3><ul class="board-list">${rows.length ? rows.map((g) => `<li class="board-row"><span class="symbol">?</span><span><strong>${esc(gapClaim(g))}</strong><small>${esc(clip(g.why || "Reason not recorded.", 92))}</small></span><span class="tag">${esc(g.ask_id || "—")}<br>${esc(human(g.verdict))}</span></li>`).join("") : `<li class="board-row"><span class="symbol">—</span><span><strong>No refused measurements</strong></span></li>`}</ul></section>`;
    }
    function questionsBoard(report) {
      const metrics = report.metrics || [], gaps = report.gaps || [];
      const questions = Object.keys(ASK).map((ask) => {
        const metric = metrics.find((m) => m.ask_id === ask), gap = gaps.find((g) => g.ask_id === ask);
        const answer = gap ? human(gap.verdict) : metric ? metric.fidelity || "answered" : "not present";
        return `<div class="question"><span class="ask">${ask}</span><strong>${esc(ASK[ask])}</strong><span class="answer">${esc(answer)}</span></div>`;
      }).join("");
      const fidelityMetrics = [firstForAsk(report, "A01"), firstForAsk(report, "A04"), calibrationMetric(report)].filter((m, i, a) => m && a.indexOf(m) === i);
      return `<section class="board wide"><div class="section-head"><h3>Eleven questions, with limits intact</h3><p>fidelity and coverage copied from metrics</p></div><div class="question-grid">${questions}</div><div class="fidelity-strip">${fidelityMetrics.length ? fidelityMetrics.map((m) => `<div class="fidelity-item"><strong>${esc(m.name || m.ask_id || m.id)}</strong><span>${esc(fidelityLabel(m))}${m.calibration ? ` · agrees ${esc(pct(m.calibration.agreement))} (n=${esc(fmt(m.calibration.n, 0))})` : ""}</span></div>`).join("") : `<div class="fidelity-item"><strong>No fidelity records</strong><span>Metrics were not included.</span></div>`}</div></section>`;
    }

    function renderDashboard(report) {
      const regs = regressionFindings(report);
      const pending = regs.filter((f) => { const p = lookup(report, f).p; return p && !(p.approval && p.approval.verdict); });
      const primary = criticalFinding(report);
      return `<div class="view dashboard page"><section class="dash-title"><div><p class="eyebrow">Incident map</p><h1 class="display">${esc(regs.length)} regressions. ${esc(pending.length)} await a decision.</h1></div><div><p class="lede">Scan the fault line, choose a case, and decide only after the evidence holds.</p>${primary ? `<a class="secondary-link" href="#/f/${encodeURIComponent(primary.id)}">Review critical finding →</a>` : ""}</div></section>${statusRow(report, "kpi-band")}<section aria-labelledby="faults-title"><div class="section-head"><h2 id="faults-title">Regressions</h2><p>one card per finding</p></div><div class="fault-grid">${regs.length ? regs.map((f, i) => faultCard(report, f, i)).join("") : `<div class="empty-card">No regressions were recorded in this report.</div>`}</div></section><section aria-label="Interactive fault timeline">${timeline(report, true)}</section><section class="boards" aria-label="Guardrails and measurement fidelity">${dismissedBoard(report)}${gapsBoard(report)}${questionsBoard(report)}</section></div>`;
    }

    function barChart(rows, metric) {
      const values = rows.map((row) => row[1]).filter(isNum), max = values.length ? Math.max.apply(null, values) : 1;
      return `<div class="bar-chart">${rows.map(([label, value, cls]) => `<div class="bar-row ${cls || ""}"><span class="bar-label">${esc(label)}</span><span class="bar-track"><i class="bar-fill" style="width:${isNum(value) && max > 0 ? Math.max(2, value / max * 100) : 0}%"></i></span><span class="bar-value">${esc(showValue(metric, value))}</span></div>`).join("")}</div>`;
    }
    function evidenceDetails(title, items) {
      const list = (items || []).filter(Boolean);
      return list.length ? `<details class="disclosure"><summary>${esc(title)}</summary><div class="disclosure-body"><ul class="evidence-list">${list.map((item) => `<li>${esc(item)}</li>`).join("")}</ul></div></details>` : "";
    }
    function techBlock(pack) {
      const ac = pack.d && pack.d.attributed_change;
      const values = [pack.d && pack.d.cause_class, pack.f && pack.f.metric, pack.p && pack.p.change_type, ac && ac.kind, pack.v && pack.v.replay_run_id, pack.f && pack.f.id].filter(Boolean);
      return values.length ? `<footer class="tech-foot"><p class="tech-head">Technical names</p><div class="tech-list">${values.map((v) => `<code>${esc(v)}</code>`).join("")}</div></footer>` : "";
    }
    function configLine(diagnosis) {
      const change = diagnosis && diagnosis.attributed_change;
      if (!change) return `<div class="config-line"><span class="config-day">—</span><span><strong>No attributed configuration change</strong><small>The report does not name one.</small></span></div>`;
      const version = [change.from, change.to].filter((x) => x != null).join(" → ");
      const exact = `${change.kind || "change"} ${change.target || ""}${version ? ` ${version}` : ""} on day ${change.day}`.replace(/\s+/g, " ").trim();
      return `<div class="config-line"><span class="config-day">day ${esc(change.day)}</span><span><strong>${esc(change.target || change.kind || "configuration")}</strong><small>${esc(exact)}</small></span></div>`;
    }

    function impactSection(finding) {
      const impact = finding.impact || {}, down = impact.downstream || {}, share = impact.share_of_traffic;
      const harms = [
        [down.would_have_resolved_at_baseline, "lost resolutions", "count"],
        [down.extra_turns, "extra turns", "count"],
        [down.resolved_conversations_slowed, "resolved, slowed", "count"],
        [down.unplanned_handoffs, "unplanned handoffs", "count"],
        [down.abandoned, "abandoned", "count"],
        [down.excess_cost_usd, "excess cost", "money"],
      ].filter(([value]) => value != null).slice(0, 3);
      while (harms.length < 3) harms.push([null, "not recorded", "count"]);
      return `<section class="impact-block" aria-label="Impact"><div class="impact-lead"><div class="impact-big"><strong>${esc(fmt(impact.conversations_affected, 0))}</strong><span>conversations affected</span></div><div class="impact-copy"><p>${esc(finding.if_nothing_changes || "The report does not state the cost of inaction.")}</p><small>${isNum(share) ? `${esc(pct(share))} of ${esc(finding.tenant || "tenant")} traffic · ` : ""}${esc(windowLabel(finding.window))}</small></div></div><div><div class="harm-panel">${harms.map(([value, label, kind]) => `<div class="harm"><strong>${kind === "money" ? esc(money(value)) : esc(fmt(value, 0))}</strong><span>${esc(label)}</span></div>`).join("")}<div class="harm"><strong>${esc(money(impact.cost_usd))}</strong><span>recorded cost</span></div></div><div class="derive"><details class="disclosure"><summary>How the impact was derived</summary><div class="disclosure-body"><p>${esc(impact.derivation || "Derivation not recorded.")}</p></div></details></div></div></section>`;
    }

    function renderGate(pack) {
      const p = pack.p;
      if (!p) return `<div class="gate-col" id="gate"><p class="idle">Nothing to approve. This is not a problem.</p></div>`;
      const decision = p.decision || {}, approval = p.approval || {};
      const recorded = approval.verdict ? `<div class="alert"><p><strong>Recorded ${esc(approval.verdict)}</strong></p><p>${esc(approval.reason || "")}</p></div>` : "";
      const risk = String(decision.risk_if_diagnosis_wrong || "");
      return `<div class="gate-col" id="gate"><p class="eyebrow">Approval gate</p>${recorded}<div data-testid="signed-copy-slot"></div><p class="ask">${esc(decision.asking_approval_for || p.description || "No approval request was recorded.")}</p>${risk ? `<p class="risk"><strong>If we are wrong.</strong> ${esc(clip(risk, 180))}</p>` : ""}<details class="disclosure"><summary>Risk and no-ship condition</summary><div class="disclosure-body"><p><strong>Risk.</strong> ${esc(decision.risk_if_diagnosis_wrong || "Not recorded.")}</p><p><strong>Would not ship if.</strong> ${esc(decision.would_not_ship_if || "Not recorded.")}</p></div></details><form id="decform"><input type="hidden" name="decided_by" value="operator"><label class="field" for="why">Reason required</label><textarea class="input" id="why" name="reason" required maxlength="4000" autocomplete="off" placeholder="Why are you making this call?"></textarea><div class="btn-row"><button class="btn btn-ok" type="submit" name="verdict" value="accepted">Accept</button><button class="btn btn-bad" type="submit" name="verdict" value="rejected">Reject</button><button class="btn btn-ghost" type="submit" name="verdict" value="deferred">Defer</button></div><div class="flash" id="flash" role="status" aria-live="polite"></div></form>${techBlock(pack)}</div>`;
    }

    function renderDetail(report, finding) {
      if (!finding) return `<div class="view case page"><a class="case-back" href="#/dashboard">← Incident map</a><section class="case-state"><p class="eyebrow">Case not found</p><h1 class="display">This finding is not in the report.</h1><p class="lede">Use the incident map to choose an available case.</p><a class="primary" href="#/dashboard">Open incident map →</a></section></div>`;
      if (!finding.is_regression) return renderDismissedDetail(report, finding);
      const pack = lookup(report, finding), d = pack.d || {}, p = pack.p || {}, v = pack.v, s = pack.s;
      const standardRows = s ? [["Observed cohort", finding.observed, "observed"], ["Cohort median", s.median], ["Reference standard", s.best]] : [["Observed", finding.observed, "observed"], ["Baseline", finding.expected]];
      const replay = v ? `<div class="replay-stamp"><span class="seal">✓</span><span><strong>Replay ${esc(v.verdict || "recorded")}: ${esc(showValue(v.metric, v.before))} → ${esc(showValue(v.metric, v.after))}</strong><small>${v.golden_set_pass === true ? "Golden set passed" : v.golden_set_pass === false ? "Golden set did not pass" : "Golden-set result not recorded"} · simulated replay baseline</small></span></div>` : `<p>No replay result is present for this prescription.</p>`;
      return `<div class="view case page"><a class="case-back" href="#/dashboard">← Incident map</a><article id="detail"><section class="case-hero"><div><p class="eyebrow">${esc(finding.severity || "unrated")} regression / ${esc(finding.id)}</p><h1 class="display">${esc(finding.headline || metricLabel(finding.metric))}</h1><div class="case-meta"><span>${esc(cohortLabel(finding))}</span><span>${esc(windowLabel(finding.window))}</span><span>${esc(audienceLabel(finding.audience))} needs to act.</span></div></div><aside class="action-card"><p class="eyebrow">Recommended action</p><h2>${esc(clip(p.decision && p.decision.asking_approval_for || p.description || "No prescription recorded.", 170))}</h2><p>${esc(v ? `Replay ${v.verdict || "recorded"}. Review the evidence, then leave a reasoned verdict.` : "No replay result yet. Review the evidence and no-ship condition before deciding.")}</p><a class="primary" href="#decision">Make the call →</a></aside></section>${impactSection(finding)}<section class="case-grid"><div class="case-card"><p class="eyebrow">Diagnosis</p><h2>${esc(causeLabel(d.cause_class))}</h2><p>${d.confidence != null ? `Confidence ${esc(pct(d.confidence))}. ` : ""}The attributed change is pinned to the finding window.</p>${configLine(d)}${evidenceDetails("Evidence", [].concat(finding.evidence || [], d.evidence || []))}</div><div class="case-card"><p class="eyebrow">Standard vs cohort</p><h2>${esc(metricLabel(finding.metric))}</h2><p>${esc(finding.baseline || s && s.derivation || "The report does not describe the baseline.")}</p>${barChart(standardRows, finding.metric)}${s ? `<details class="disclosure"><summary>Reference standard derivation</summary><div class="disclosure-body"><p>${esc(s.derivation || "Not recorded.")}</p><p class="mono">exemplars ${esc(fmt(s.exemplar_n, 0))} · ${esc(s.golden_set_version || "version not recorded")}</p></div></details>` : ""}</div><div class="case-card"><p class="eyebrow">Prescription</p><h2>${esc(p.target || "No target recorded")}</h2><p>${esc(p.description || "No proposed change is present.")}</p>${p.predicted_delta ? barChart([["Current", p.predicted_delta.from, "observed"], ["Predicted", p.predicted_delta.to]], p.predicted_delta.metric) : ""}<details class="disclosure"><summary>Risk and no-ship condition</summary><div class="disclosure-body"><p>${esc(p.decision && p.decision.risk_if_diagnosis_wrong || "Risk not recorded.")}</p><p><strong>No ship:</strong> ${esc(p.decision && p.decision.would_not_ship_if || "Condition not recorded.")}</p></div></details></div><div class="case-card"><p class="eyebrow">Replay result</p><h2>${v ? esc(v.verdict || "Replay recorded") : "Not verified this run"}</h2><p>${v ? "The test baseline comes from the replay service, not live traffic." : "Absence is explicit; the decision record still remains available."}</p>${replay}${v ? barChart([["Replay before", v.before, "observed"], ["Replay after", v.after]], v.metric) : ""}</div></section><section class="decision-wrap" id="decision"><div class="decision-intro"><p class="eyebrow">Human control</p><h2>Decide, with a reason.</h2><p>Accept, reject, and defer are equally valid outcomes. The report is reloaded after the write so this screen never becomes a second source of truth.</p>${honestyBlock(report)}</div>${renderGate(pack)}</section><nav class="compat-hook" id="list" tabindex="-1" aria-hidden="true">Finding keyboard compatibility</nav></article></div>`;
    }

    function renderDismissedDetail(report, finding) {
      const pack = lookup(report, finding);
      return `<div class="view case page"><a class="case-back" href="#/dashboard">← Incident map</a><article id="detail"><section class="case-hero"><div><p class="eyebrow">Dismissed signal / ${esc(finding.id)}</p><h1 class="display">${esc(finding.headline || "Not a regression")}</h1><div class="case-meta"><span>${esc(cohortLabel(finding))}</span><span>${esc(windowLabel(finding.window))}</span></div></div><aside class="action-card"><p class="eyebrow">Disposition</p><h2>Do not open a change from this signal.</h2><p>${esc(clip(finding.not_a_regression_because || "The report marks this as not a regression.", 220))}</p><a class="primary" href="#/dashboard">Return to the map →</a></aside></section><section class="case-grid"><div class="case-card"><p class="eyebrow">Observed vs expected</p><h2>${esc(metricLabel(finding.metric))}</h2>${barChart([["Observed", finding.observed, "observed"], ["Expected", finding.expected]], finding.metric)}</div><div class="case-card"><p class="eyebrow">Why it was dismissed</p><h2>${esc(causeLabel(pack.d && pack.d.cause_class))}</h2><p>${esc(finding.not_a_regression_because || "No dismissal reason was recorded.")}</p>${evidenceDetails("Evidence", [].concat(finding.evidence || [], pack.d && pack.d.evidence || []))}</div></section><section class="decision-wrap"><div class="decision-intro"><p class="eyebrow">Human control</p><h2>No decision required.</h2><p>The system keeps this lookalike visible to show what it considered and rejected.</p>${honestyBlock(report)}</div><div class="gate-col" id="gate"><p class="idle">Nothing to approve. This is not a problem.</p>${techBlock(pack)}</div></section></article></div>`;
    }

    function renderGap(report, gap) {
      if (!gap) return renderDetail(report, null);
      const event = gap.required_event || {};
      return `<div class="view case page"><a class="case-back" href="#/dashboard">← Incident map</a><article id="detail"><section class="case-hero"><div><p class="eyebrow">Refused measurement / ${esc(gap.ask_id || "unknown ask")}</p><h1 class="display">${esc(gapClaim(gap))}.</h1><div class="case-meta"><span>${esc(human(gap.verdict))}</span><span>${esc(event.owner || "owner not recorded")}</span></div></div><aside class="action-card"><p class="eyebrow">Honest absence</p><h2>There is no defensible number to show.</h2><p>${esc(clip(gap.why || "The report records no reason.", 220))}</p><a class="primary" href="#/dashboard">Return to the map →</a></aside></section><section class="case-grid"><div class="case-card"><p class="eyebrow">Why we refused</p><h2>${esc(ASK[gap.ask_id] || gap.ask_id || "Unanswered question")}</h2><p>${esc(gap.why || "Reason not recorded.")}</p><details class="disclosure"><summary>Nearest proxy and why it misleads</summary><div class="disclosure-body"><p><strong>Proxy.</strong> ${esc(gap.nearest_proxy || "Not recorded.")}</p><p>${esc(gap.why_the_proxy_misleads || "No warning recorded.")}</p></div></details></div><div class="case-card"><p class="eyebrow">Instrumentation needed</p><h2>${esc(event.name || "Required event not recorded")}</h2><p>Owned by ${esc(event.owner || "an unassigned team")} at ${esc(event.grain || "unspecified")} grain.</p><div class="tech-list">${(event.fields || []).map((field) => `<code>${esc(field)}</code>`).join("") || `<code>fields not recorded</code>`}</div></div></section><section class="decision-wrap"><div class="decision-intro"><p class="eyebrow">Human control</p><h2>No false precision.</h2><p>This refusal is a product output, not an apology.</p>${honestyBlock(report)}</div><div class="gate-col" id="gate"><p class="idle">${gap.ask_id === "A11" ? "Nothing to approve. We will not invent a failover rate." : gap.verdict === "NOT_MEASURABLE" ? "Nothing to approve. We will not invent this number." : `Nothing to approve. ${esc(gapClaim(gap))}.`}</p></div></section></article></div>`;
    }

    function bindGate(report, finding) {
      const form = $("decform");
      if (!form || !finding) return;
      const pack = lookup(report, finding), slot = form.closest("#gate").querySelector('[data-testid="signed-copy-slot"]');
      if (slot && window.SignedCopy && window.SignedCopy.ui) window.SignedCopy.ui.render(slot, finding);
      const compatList = $("list");
      if (compatList) compatList.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
        event.preventDefault();
        const findings = regressionFindings(report);
        const current = Math.max(0, findings.findIndex((item) => item.id === finding.id));
        const offset = event.key === "ArrowDown" ? 1 : -1;
        const next = findings[(current + offset + findings.length) % findings.length];
        if (next) location.hash = next.id;
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = new FormData(form), reason = String(data.get("reason") || "").trim(), why = $("why"), flash = $("flash");
        if (!reason) { why.setAttribute("aria-invalid", "true"); flash.className = "flash err"; flash.textContent = "A reason is required."; why.focus(); return; }
        why.setAttribute("aria-invalid", "false");
        const buttons = form.querySelectorAll("button"); buttons.forEach((button) => { button.disabled = true; });
        flash.className = "flash"; flash.textContent = "Saving…";
        try {
          await api("/decision", { method: "POST", body: JSON.stringify({ prescription_id: pack.p.id, verdict: event.submitter && event.submitter.value || data.get("verdict"), decided_by: data.get("decided_by") || "operator", reason }) });
          window.__rep = await api("/report.json"); render();
        } catch (error) { flash.className = "flash err"; flash.textContent = String(error.message || error); why.setAttribute("aria-invalid", "true"); buttons.forEach((button) => { button.disabled = false; }); }
      });
    }

    function currentFinding(report) { const r = route(); return r.view === "detail" ? findById(report, r.id) : defaultFinding(report); }
    function render() {
      const report = window.__rep;
      if (!report) return;
      const r = route(); setNav(r.view); $("hdr").textContent = `${report.team || "—"} · ${report.corpus || "—"}`;
      if (r.view === "dashboard") $("app").innerHTML = renderDashboard(report);
      else if (r.view === "detail") { const finding = findById(report, r.id); $("app").innerHTML = renderDetail(report, finding); bindGate(report, finding && finding.is_regression ? finding : null); }
      else if (r.view === "gap") { const gap = (report.gaps || []).find((g) => g.ask_id === r.id) || null; $("app").innerHTML = renderGap(report, gap); }
      else $("app").innerHTML = renderLanding(report);
      document.body.dataset.ready = "true";
      const selected = currentFinding(report);
      document.title = r.view === "detail" ? `${selected && (selected.headline || selected.id) || "Case"} — Nexus Loop` : r.view === "dashboard" ? "Incident map — Nexus Loop" : "Nexus Loop — operator review";
      requestAnimationFrame(() => document.querySelectorAll(".timeline-scroll").forEach((el) => {
        if (el.scrollWidth > el.clientWidth) el.scrollLeft = el.scrollWidth;
      }));
    }

    async function generateReport() {
      const button = $("gen-btn"), flash = $("gen-flash"); button.disabled = true; flash.className = "gen-flash"; flash.textContent = "Generating…";
      try { const summary = await api("/generate", { method: "POST", body: "{}", timeoutMs: 200000 }); window.__rep = await api("/report.json"); render(); flash.className = "gen-flash ok"; flash.textContent = `Updated · ${summary.findings == null ? "—" : summary.findings} findings`; }
      catch (error) { flash.className = "gen-flash err"; flash.textContent = String(error.message || error); }
      finally { button.disabled = false; }
    }

    $("gen-btn").addEventListener("click", generateReport);
    window.addEventListener("hashchange", render);
    api("/health").then((health) => { if (health && health.generate === false) $("gen-btn").title = "Generation is disabled on this server"; }).catch(() => {});
    api("/report.json").then((report) => { window.__rep = report; render(); }).catch((error) => { $("app").innerHTML = `<div class="page case-state"><p class="eyebrow">Report unavailable</p><h1 class="display">The decision surface could not load.</h1><p class="lede">${esc(error.message || error)}</p></div>`; document.body.dataset.ready = "true"; });

    window.NexusDesk = Object.freeze({
      selectedFinding() { return window.__rep ? currentFinding(window.__rep) : null; },
      bucketOf(finding) { return finding ? finding.is_regression ? "open" : "ignored" : null; },
      findingsIn(bucket) { const report = window.__rep; if (!report) return []; if (bucket === "open") return regressionFindings(report); if (bucket === "ignored") return dismissedFindings(report); return []; },
      bucketCountText(bucket) { if (bucket === "refused") return window.__rep ? String((window.__rep.gaps || []).length) : null; return String(this.findingsIn(bucket).length); },
      findingUrl(finding) { return finding && finding.id ? location.origin + location.pathname + location.search + "#" + finding.id : null; },
      runLabelText() { const r = window.__rep; return r ? `${r.team || "—"} · ${r.corpus || "—"}` : null; },
      claimText(finding) { return finding ? finding.headline || metricLabel(finding.metric) || null : null; },
      metricLabel(finding) { return finding ? metricLabel(finding.metric) || null : null; },
      observedText(finding) { return finding && finding.observed != null ? showValue(finding.metric, finding.observed) : null; },
      expectedText(finding) { return finding && finding.expected != null ? showValue(finding.metric, finding.expected) : null; },
      affectedFigureText(finding) { const n = finding && finding.impact && finding.impact.conversations_affected; return n == null ? null : fmt(n, 0); },
      causeText(finding) { const p = window.__rep && finding ? lookup(window.__rep, finding) : null; return p && p.d ? causeLabel(p.d.cause_class) : null; },
      configChangeText(finding) { const p = window.__rep && finding ? lookup(window.__rep, finding) : null, c = p && p.d && p.d.attributed_change; if (!c) return null; const version = [c.from, c.to].filter((x) => x != null).join(" → "); return `${c.kind || "change"} ${c.target || ""}${version ? ` ${version}` : ""} on day ${c.day}`.replace(/\s+/g, " ").trim(); },
      changeTargetText(finding) { const p = window.__rep && finding ? lookup(window.__rep, finding).p : null; return p && p.target != null ? String(p.target) : null; },
      changeDescriptionText(finding) { const p = window.__rep && finding ? lookup(window.__rep, finding).p : null; return p && p.description != null ? String(p.description) : null; },
      replayText(finding) { const v = window.__rep && finding ? lookup(window.__rep, finding).v : null; return v && v.before != null && v.after != null ? { before: showValue(v.metric, v.before), after: showValue(v.metric, v.after) } : null; },
      riskText(finding) { const p = window.__rep && finding ? lookup(window.__rep, finding).p : null, value = p && p.decision && p.decision.risk_if_diagnosis_wrong; return value ? String(value) : null; },
      ifNothingChangesText(finding) { return finding && finding.if_nothing_changes ? String(finding.if_nothing_changes) : null; },
      ownerText(finding) { return finding ? audienceLabel(finding.audience) + " needs to act." : null; },
      technicalNames(finding) { if (!window.__rep || !finding) return []; const p = lookup(window.__rep, finding), c = p.d && p.d.attributed_change; return [p.d && p.d.cause_class, finding.metric, p.p && p.p.change_type, c && c.kind, p.v && p.v.replay_run_id, finding.id].filter(Boolean).map(String); },
      coverageText() { const r = window.__rep, m = r && (firstForAsk(r, "A01") || (r.metrics || []).find((item) => item.coverage)); return m && m.coverage && m.coverage.value != null ? "coverage " + pct(m.coverage.value) : null; },
      refusalClaims() { return window.__rep ? (window.__rep.gaps || []).slice().sort((a,b) => a.ask_id === "A11" ? -1 : b.ask_id === "A11" ? 1 : 0).map(gapClaim) : []; },
      decisionFor(finding) { const p = window.__rep && finding ? lookup(window.__rep, finding).p : null, a = p && p.approval; return a && a.verdict ? { verdict: a.verdict, reason: a.reason, recordedAtText: null } : null; }
    });
  })();
  </script>
</body>
</html>
