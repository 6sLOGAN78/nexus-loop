<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus Loop — one decision</title>
  <style>
    /*
      Operator POV (why this page is quiet)
      A stranger on Monday morning needs: what broke, how bad, who acts,
      what to change, then a signature. Everything else is evidence they
      can open — not a dashboard competing with the claim.
      Paper + navy = a brief to sign. Three-layer tokens (design-system
      skill): hex only in primitives. Accept = primary. Reject = destructive
      (a valid outcome). Recorded accept = success.
      Serif = the claim. Sans = evidence. No webfonts (sealed run).
    */

    /* === PRIMITIVES — raw values, change rarely === */
    :root {
      --color-navy-900: #1a1f2b;   /* ink */
      --color-navy-800: #173a5c;   /* primary hover/active */
      --color-navy-700: #1f4e79;   /* brand primary */
      --color-navy-100: #e8eef6;   /* chip fill */
      --color-paper-50: #f6f4ef;   /* page background */
      --color-white: #ffffff;
      --color-green-600: #1b7f4e;
      --color-green-100: #e3f6ea;
      --color-amber-600: #9a6700;
      --color-amber-100: #fff4d6;
      --color-red-800: #8a1c14;   /* destructive hover */
      --color-red-600: #b42318;
      --color-red-100: #fde8e6;
      --color-slate-500: #5c6578;  /* muted text, ≥4.5:1 on paper */
      --color-slate-200: #d8deea;  /* borders */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --radius-md: 0.375rem;
      --radius-lg: 0.5rem;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --duration-fast: 150ms;
      --font-serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      --font-sans: ui-sans-serif, system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-size-2xs: 0.6875rem;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.5rem;
      --font-size-2xl: 1.85rem;
      --leading-tight: 1.25;
      --leading-normal: 1.5;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --opacity-disabled: 0.5;
      --ring-width: 2px;
      --ring-offset: 2px;
    }

    /* === SEMANTIC — purpose aliases (no hex) === */
    :root {
      --color-background: var(--color-paper-50);
      --color-foreground: var(--color-navy-900);
      --color-primary: var(--color-navy-700);
      --color-primary-hover: var(--color-navy-800);
      --color-primary-active: var(--color-navy-900);
      --color-primary-foreground: var(--color-white);
      --color-destructive: var(--color-red-600);
      --color-destructive-hover: var(--color-red-800);
      --color-destructive-foreground: var(--color-white);
      --color-success: var(--color-green-600);
      --color-success-foreground: var(--color-white);
      --color-warning: var(--color-amber-600);
      --color-warning-foreground: var(--color-navy-900);
      --color-muted: var(--color-navy-100);
      --color-muted-foreground: var(--color-slate-500);
      --color-border: var(--color-slate-200);
      --color-ring: var(--color-navy-700);
      --color-card: var(--color-white);
      --color-card-foreground: var(--color-foreground);
      --font-heading: var(--font-serif);
      --font-body: var(--font-sans);
      --font-caption: var(--font-sans);
    }

    /* === COMPONENTS — never hex here === */
    :root {
      --button-bg: var(--color-primary);
      --button-fg: var(--color-primary-foreground);
      --button-hover-bg: var(--color-primary-hover);
      --button-active-bg: var(--color-primary-active);
      --button-destructive-bg: var(--color-destructive);
      --button-destructive-fg: var(--color-destructive-foreground);
      --button-destructive-hover-bg: var(--color-destructive-hover);
      --button-outline-bg: var(--color-card);
      --button-outline-border: var(--color-border);
      --button-outline-fg: var(--color-foreground);
      --button-outline-hover-bg: var(--color-muted);
      --button-padding-x: var(--space-4);
      --button-padding-y: var(--space-2);
      --button-radius: var(--radius-md);
      --button-font-size: var(--font-size-sm);
      --button-font-weight: var(--font-weight-semibold);
      --card-bg: var(--color-card);
      --card-fg: var(--color-card-foreground);
      --card-border: var(--color-border);
      --card-shadow: var(--shadow-sm);
      --card-shadow-hover: var(--shadow-md);
      --card-padding: var(--space-6);
      --card-radius: var(--radius-lg);
      --badge-bg: var(--color-muted);
      --badge-fg: var(--color-foreground);
      --badge-secondary-bg: var(--color-card);
      --badge-secondary-fg: var(--color-muted-foreground);
      --badge-destructive-bg: var(--color-red-100);
      --badge-destructive-fg: var(--color-destructive);
      --badge-success-bg: var(--color-green-100);
      --badge-success-fg: var(--color-success);
      --badge-warning-bg: var(--color-amber-100);
      --badge-warning-fg: var(--color-warning);
      --badge-outline-border: var(--color-border);
      --badge-padding-x: var(--space-2);
      --badge-padding-y: var(--space-1);
      --badge-radius: var(--radius-full);
      --badge-font-size: var(--font-size-xs);
      --input-bg: var(--color-card);
      --input-border: var(--color-border);
      --input-fg: var(--color-foreground);
      --input-focus-border: var(--color-ring);
      --input-error-border: var(--color-destructive);
      --input-padding-x: var(--space-3);
      --input-padding-y: var(--space-2);
      --input-radius: var(--radius-md);
      --alert-bg: var(--color-muted);
      --alert-fg: var(--color-foreground);
      --alert-border: var(--color-border);
      --alert-success-bg: var(--color-green-100);
      --alert-success-border: var(--color-success);
      --alert-warning-bg: var(--color-amber-100);
      --alert-warning-border: var(--color-warning);
      --alert-padding: var(--space-4);
      --alert-radius: var(--radius-md);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--color-background);
      color: var(--color-foreground);
      font-family: var(--font-body);
      font-size: var(--font-size-base);
      line-height: var(--leading-normal);
    }
    .skip {
      position: absolute; left: -999px; top: 0;
      background: var(--color-primary); color: var(--color-primary-foreground);
      padding: var(--space-2) var(--space-3);
    }
    .skip:focus { left: var(--space-2); top: var(--space-2); z-index: 10; }

    .wrap {
      max-width: 68rem;
      margin: 0 auto;
      padding: var(--space-6) var(--space-5) var(--space-8);
    }
    header.app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
    header.app-header h1 {
      font-family: var(--font-heading);
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      margin: 0;
    }
    header.app-header .meta {
      font-family: var(--font-caption);
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
    }
    .honesty {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2) var(--space-3);
      margin-top: var(--space-2);
    }
    .honesty details {
      font-family: var(--font-caption);
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
    }
    .honesty details .note { margin: var(--space-2) 0 0; max-width: 72ch; }

    .switcher {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      margin: 0 0 var(--space-6);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--color-border);
    }
    .switcher .lbl {
      font-family: var(--font-caption);
      font-size: var(--font-size-2xs);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted-foreground);
      margin-right: var(--space-1);
    }
    .switcher .group {
      display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1);
      margin-right: var(--space-2);
    }
    .tab {
      font-family: var(--font-caption);
      font-size: var(--font-size-xs);
      background: transparent;
      color: var(--color-foreground);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      padding: var(--space-1) var(--space-3);
      cursor: pointer;
      transition: background var(--duration-fast), color var(--duration-fast), border-color var(--duration-fast);
    }
    .tab:hover { background: var(--color-muted); }
    .tab:focus-visible {
      outline: none;
      box-shadow: 0 0 0 var(--ring-offset) var(--color-background),
                  0 0 0 calc(var(--ring-offset) + var(--ring-width)) var(--color-ring);
    }
    .tab.is-selected {
      background: var(--color-primary);
      color: var(--color-primary-foreground);
      border-color: var(--color-primary);
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 17.5rem;
      gap: var(--space-8);
      align-items: start;
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; gap: var(--space-6); }
      .gate-col { position: static; }
    }

    h2.claim {
      font-family: var(--font-heading);
      font-size: var(--font-size-2xl);
      line-height: var(--leading-tight);
      font-weight: var(--font-weight-semibold);
      margin: 0 0 var(--space-3);
    }
    .eyebrow {
      font-family: var(--font-caption);
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
      margin: 0 0 var(--space-2);
    }
    .lede {
      font-family: var(--font-body);
      font-size: var(--font-size-base);
      margin: 0 0 var(--space-5);
    }
    .muted { color: var(--color-muted-foreground); }
    .body { font-family: var(--font-body); font-size: var(--font-size-sm); }
    p { margin: 0 0 var(--space-4); }
    p:last-child { margin-bottom: 0; }
    code { font-family: var(--font-mono); font-size: var(--font-size-xs); }

    .block { margin: 0 0 var(--space-6); }
    .block h3 {
      font-family: var(--font-caption);
      font-size: var(--font-size-2xs);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-muted-foreground);
      margin: 0 0 var(--space-2);
    }

    .harm {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-4);
      margin: 0 0 var(--space-4);
    }
    @media (max-width: 640px) { .harm { grid-template-columns: 1fr; } }
    .harm div { font-family: var(--font-body); }
    .harm strong {
      display: block;
      font-size: var(--font-size-xl);
      font-variant-numeric: tabular-nums;
      font-weight: var(--font-weight-semibold);
      line-height: var(--leading-tight);
    }
    .harm span {
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
    }

    .replay {
      display: flex;
      gap: var(--space-6);
      font-variant-numeric: tabular-nums;
      margin: 0 0 var(--space-2);
    }
    .replay .n {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
      font-family: var(--font-body);
    }
    .replay .lbl {
      display: block;
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
    }

    details.more {
      font-family: var(--font-body);
      font-size: var(--font-size-sm);
      color: var(--color-muted-foreground);
      margin: 0 0 var(--space-4);
    }
    details.more summary {
      cursor: pointer;
      color: var(--color-primary);
      font-family: var(--font-caption);
      font-size: var(--font-size-xs);
      list-style: none;
    }
    details.more summary::-webkit-details-marker { display: none; }
    details.more summary::before { content: "▸ "; }
    details.more[open] summary::before { content: "▾ "; }
    details.more[open] { color: var(--color-foreground); }
    details.more .inner { margin-top: var(--space-3); }
    .evidence { margin: 0; padding-left: var(--space-5); }
    .evidence li { margin: 0 0 var(--space-2); }

    .badge {
      display: inline-flex; align-items: center;
      font-family: var(--font-caption);
      font-size: var(--badge-font-size);
      line-height: 1.2;
      background: var(--badge-bg);
      color: var(--badge-fg);
      border-radius: var(--badge-radius);
      padding: var(--badge-padding-y) var(--badge-padding-x);
      border: 1px solid transparent;
    }
    .badge.secondary { background: var(--badge-secondary-bg); color: var(--badge-secondary-fg); border-color: var(--badge-outline-border); }
    .badge.destructive { background: var(--badge-destructive-bg); color: var(--badge-destructive-fg); }
    .badge.success { background: var(--badge-success-bg); color: var(--badge-success-fg); }
    .badge.warning { background: var(--badge-warning-bg); color: var(--badge-warning-fg); }
    .badge.outline { background: transparent; border-color: var(--badge-outline-border); }
    .chips { display: flex; flex-wrap: wrap; gap: var(--space-1); margin: 0 0 var(--space-4); }

    .card {
      background: var(--card-bg);
      color: var(--card-fg);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: var(--card-padding);
      box-shadow: var(--card-shadow);
    }
    .gate-col { position: sticky; top: var(--space-4); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%;
      background: var(--button-bg);
      color: var(--button-fg);
      border: 1px solid transparent;
      border-radius: var(--button-radius);
      padding: var(--button-padding-y) var(--button-padding-x);
      font-family: var(--font-caption);
      font-size: var(--button-font-size);
      font-weight: var(--button-font-weight);
      cursor: pointer;
      transition: background var(--duration-fast), box-shadow var(--duration-fast);
    }
    .btn:hover { background: var(--button-hover-bg); }
    .btn:active { background: var(--button-active-bg); }
    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 var(--ring-offset) var(--color-background),
                  0 0 0 calc(var(--ring-offset) + var(--ring-width)) var(--color-ring);
    }
    .btn:disabled, .btn.is-loading {
      opacity: var(--opacity-disabled);
      pointer-events: none;
      cursor: not-allowed;
    }
    .btn-destructive {
      background: var(--button-destructive-bg);
      color: var(--button-destructive-fg);
    }
    .btn-destructive:hover, .btn-destructive:active {
      background: var(--button-destructive-hover-bg);
    }
    .btn-outline {
      background: var(--button-outline-bg);
      color: var(--button-outline-fg);
      border-color: var(--button-outline-border);
    }
    .btn-outline:hover { background: var(--button-outline-hover-bg); }
    .btn-outline:active { background: var(--color-muted); }
    .btn-row { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-4); }

    .input, textarea.input {
      width: 100%;
      background: var(--input-bg);
      color: var(--input-fg);
      border: 1px solid var(--input-border);
      border-radius: var(--input-radius);
      padding: var(--input-padding-y) var(--input-padding-x);
      font-family: var(--font-body);
      font-size: var(--font-size-sm);
    }
    .input:hover { border-color: var(--color-muted-foreground); }
    .input:focus, .input:focus-visible {
      outline: none;
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 var(--ring-offset) var(--color-background),
                  0 0 0 calc(var(--ring-offset) + var(--ring-width)) var(--color-ring);
    }
    .input[aria-invalid="true"] { border-color: var(--input-error-border); }
    textarea.input { min-height: 4.5rem; resize: vertical; }
    label.field {
      display: block;
      font-family: var(--font-caption);
      font-size: var(--font-size-xs);
      margin: var(--space-3) 0 var(--space-1);
    }

    .alert {
      background: var(--alert-bg);
      color: var(--alert-fg);
      border: 1px solid var(--alert-border);
      border-radius: var(--alert-radius);
      padding: var(--alert-padding);
      font-family: var(--font-body);
      font-size: var(--font-size-sm);
    }
    .alert.success { background: var(--alert-success-bg); border-color: var(--alert-success-border); }
    .alert.warning { background: var(--alert-warning-bg); border-color: var(--alert-warning-border); }
    .alert p { margin: 0 0 var(--space-2); }
    .alert p:last-child { margin: 0; }
    .alert.compact { margin-bottom: var(--space-4); }
    .ask { font-family: var(--font-body); font-size: var(--font-size-sm); margin: 0 0 var(--space-3); }

    footer.foot {
      font-family: var(--font-caption);
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
      margin-top: var(--space-8);
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border);
    }
    .flash { font-family: var(--font-caption); font-size: var(--font-size-sm); margin-top: var(--space-2); }
    .flash.err { color: var(--color-destructive); }
    .flash.ok { color: var(--color-success); }
    .spec code { display: inline; }
  </style>
</head>
<body>
  <a class="skip" href="#workspace">Skip to finding</a>
  <div class="wrap">
    <header class="app-header">
      <h1>Nexus Loop</h1>
      <div class="meta" id="hdr">loading report…</div>
      <div class="honesty" id="honesty"></div>
    </header>
    <nav class="switcher" id="rail" aria-label="Findings, lookalikes, refusals"></nav>
    <div class="shell">
      <article id="workspace">
        <p class="muted body">Waiting for <code>loop-report.json</code>.</p>
      </article>
      <aside class="gate-col">
        <section class="card" id="gate">
          <p class="muted body">A reason is required. The verdict is written back into the report.</p>
        </section>
      </aside>
    </div>
    <footer class="foot" id="foot"></footer>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    };
    const fmt = (n, d = 2) => (n === null || n === undefined) ? "—" : Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
    const pct = (n) => (n === null || n === undefined) ? "—" : (100 * n).toFixed(1) + "%";

    let selectedKey = null;

    function indexes(rep) {
      const diags = Object.fromEntries((rep.diagnoses || []).map((d) => [d.id, d]));
      const byFid = Object.fromEntries((rep.diagnoses || []).map((d) => [d.finding_id, d]));
      const pres = rep.prescriptions || [];
      const vers = rep.verifications || [];
      const byDiag = {};
      pres.forEach((p) => { byDiag[p.diagnosis_id] = p; });
      return { diags, byFid, pres, vers, byDiag };
    }

    function packForFinding(rep, f) {
      const { byFid, byDiag, vers } = indexes(rep);
      const d = f ? byFid[f.id] : null;
      const p = d ? (byDiag[d.id] || null) : null;
      const v = (p && vers.find((x) => x.prescription_id === p.id)) || null;
      return { kind: f && f.is_regression ? "regression" : "dismissed", f, d, p, v };
    }

    function defaultFinding(rep) {
      const { diags, byFid, pres, vers } = indexes(rep);
      const findings = rep.findings || [];
      if (vers.length) {
        const p = pres.find((x) => x.id === vers[0].prescription_id);
        const d = p && diags[p.diagnosis_id];
        const f = d && findings.find((x) => x.id === d.finding_id);
        if (f) return f;
      }
      const regs = findings.filter((x) => x.is_regression);
      return regs.find((x) => (byFid[x.id] || {}).cause_class === "tool.contract_break") || regs[0] || findings[0] || null;
    }

    function currentPack(rep) {
      if (selectedKey && selectedKey.startsWith("gap:")) {
        const ask = selectedKey.slice(4);
        const gap = (rep.gaps || []).find((g) => g.ask_id === ask);
        return { kind: "gap", gap };
      }
      const findings = rep.findings || [];
      const f = findings.find((x) => x.id === selectedKey) || defaultFinding(rep);
      if (f && !selectedKey) selectedKey = f.id;
      return packForFinding(rep, f);
    }

    function tabLabel(f, d) {
      if (!f) return "";
      if (!f.is_regression) return (d && d.cause_class) || f.metric || f.id;
      const h = (f.headline || f.metric || f.id).split("—")[0].trim();
      return h.length > 28 ? h.slice(0, 27) + "…" : h;
    }

    function fidelityClass(fid) {
      if (fid === "measured") return "success";
      if (fid === "derived") return "warning";
      if (fid === "judged") return "outline";
      return "secondary";
    }
    function metricChip(m) {
      if (!m) return "";
      const cov = (m.coverage && m.coverage.value != null) ? pct(m.coverage.value) : "—";
      const fid = m.fidelity || "unknown";
      const basis = (m.coverage && m.coverage.basis) || "";
      return `<span class="badge ${fidelityClass(fid)}" title="${esc(basis)} coverage ${esc(cov)}">${esc(m.ask_id || m.id)} ${esc(fid)}</span>`;
    }
    function shortNotes(notes) {
      const text = typeof notes === "string" ? notes : JSON.stringify(notes || "");
      const bits = [];
      ["REAL", "STUBBED", "SIMULATED"].forEach((label) => {
        const re = new RegExp(label + ":\\s*([\\s\\S]*?)(?=REAL:|STUBBED:|SIMULATED:|BREAKS AT|$)");
        const m = text.match(re);
        if (!m) return;
        let s = m[1].replace(/\s+/g, " ").trim();
        if (s.length > 220) s = s.slice(0, 217) + "…";
        bits.push(`<p class="note"><strong>${label}.</strong> ${esc(s)}</p>`);
      });
      return bits.join("");
    }
    function renderHonesty(rep) {
      const metrics = rep.metrics || [];
      const pick = ["A01", "A04"].map((id) => metrics.find((m) => m.ask_id === id)).filter(Boolean);
      const judged = metrics.find((m) => m.fidelity === "judged");
      if (judged && !pick.includes(judged)) pick.push(judged);
      const notes = shortNotes(rep.system_notes);
      $("honesty").innerHTML = `${pick.map(metricChip).join("")}${notes ? `<details><summary>What is real, stubbed, simulated</summary>${notes}</details>` : ""}`;
    }

    function tabBtn(key, label, selected) {
      const on = selected ? " is-selected" : "";
      return `<button type="button" class="tab${on}" data-key="${esc(key)}" aria-current="${selected ? "true" : "false"}">${esc(label)}</button>`;
    }

    function renderRail(rep) {
      const { byFid } = indexes(rep);
      const sel = selectedKey;
      const regs = (rep.findings || []).filter((f) => f.is_regression);
      const dismissed = (rep.findings || []).filter((f) => !f.is_regression);
      const gaps = rep.gaps || [];
      const a11 = gaps.filter((g) => g.ask_id === "A11");
      const rest = gaps.filter((g) => g.ask_id !== "A11");
      const parts = [];
      parts.push(`<span class="lbl">Decide</span><span class="group">`);
      regs.forEach((f) => {
        const d = byFid[f.id] || {};
        parts.push(tabBtn(f.id, tabLabel(f, d), sel === f.id));
      });
      parts.push(`</span>`);
      if (dismissed.length) {
        parts.push(`<span class="lbl">Ignored</span><span class="group">`);
        dismissed.forEach((f) => {
          const d = byFid[f.id] || {};
          parts.push(tabBtn(f.id, tabLabel(f, d), sel === f.id));
        });
        parts.push(`</span>`);
      }
      if (a11.length || rest.length) {
        parts.push(`<span class="lbl">Refused</span><span class="group">`);
        [...a11, ...rest].forEach((g) => {
          const key = "gap:" + g.ask_id;
          parts.push(tabBtn(key, g.ask_id, sel === key));
        });
        parts.push(`</span>`);
      }
      $("rail").innerHTML = parts.join("");
      $("rail").querySelectorAll("[data-key]").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedKey = btn.getAttribute("data-key");
          render(rep);
        });
      });
    }

    function details(summary, inner) {
      if (!inner) return "";
      return `<details class="more"><summary>${esc(summary)}</summary><div class="inner">${inner}</div></details>`;
    }

    function renderWorkspace(rep, pack) {
      if (pack.kind === "gap") {
        const g = pack.gap || {};
        const ev = g.required_event || {};
        const retry = g.ask_id === "A11" && g.why_the_proxy_misleads
          ? `<div class="block"><h3>Why retry is not failover</h3><p class="lede">${esc(g.why_the_proxy_misleads)}</p>
             ${g.nearest_proxy ? `<p class="muted body">Nearest proxy: <code>${esc(g.nearest_proxy)}</code></p>` : ""}</div>`
          : (g.why_the_proxy_misleads ? `<div class="block"><h3>Why the proxy misleads</h3><p>${esc(g.why_the_proxy_misleads)}</p></div>` : "");
        $("workspace").innerHTML = `
          <p class="eyebrow">We will not invent this number</p>
          <h2 class="claim">${esc(g.ask_id)} is ${esc(g.verdict || "not measurable")}</h2>
          <p class="lede">${esc(g.why || "—")}</p>
          ${retry}
          <div class="alert spec">
            <p><strong>Required event</strong> <code>${esc(ev.name || "—")}</code> at <code>${esc(ev.grain || "—")}</code> grain.</p>
            <p>Fields: <code>${esc((ev.fields || []).join(", ") || "—")}</code> · Owner: <code>${esc(ev.owner || "—")}</code></p>
          </div>`;
        return;
      }
      const { f, d, p, v } = pack;
      if (!f) {
        $("workspace").innerHTML = `<p class="muted body">No findings in this report.</p>`;
        return;
      }
      if (pack.kind === "dismissed") {
        $("workspace").innerHTML = `
          <p class="eyebrow">Lookalike — not a regression</p>
          <h2 class="claim">${esc(f.headline || f.metric || f.id)}</h2>
          <p class="lede">${esc(f.not_a_regression_because || "—")}</p>
          ${details("Evidence", `<ul class="evidence">${(f.evidence || []).map((e) => `<li>${esc(e)}</li>`).join("")}</ul>`)}`;
        return;
      }
      const ac = (d && d.attributed_change)
        ? `${d.attributed_change.kind} on day ${d.attributed_change.day}`
        : "none attributed";
      const pd = (p && p.predicted_delta) || {};
      const imp = f.impact || {};
      const down = imp.downstream || {};
      const who = (f.audience || []).join(", ") || "—";
      const extra = [];
      if (imp.share_of_traffic != null) extra.push(`${pct(imp.share_of_traffic)} of ${esc(f.tenant || "tenant")}`);
      if (imp.days_running != null) extra.push(`${fmt(imp.days_running, 0)} days`);
      extra.push(imp.cost_usd == null ? "recorded cost null" : `recorded cost $${fmt(imp.cost_usd)}`);
      if (down.abandoned != null) extra.push(`${fmt(down.abandoned, 0)} abandoned`);
      if (down.extra_turns != null) extra.push(`${fmt(down.extra_turns, 0)} extra turns`);
      const replay = v ? `
        <div class="replay">
          <div><span class="lbl">Replay before</span><div class="n">${fmt(v.before, 4)}</div></div>
          <div><span class="lbl">Replay after</span><div class="n">${fmt(v.after, 4)}</div></div>
        </div>
        <p><strong>${esc(v.verdict)}</strong>${v.golden_set_pass === true ? " · golden set pass" : v.golden_set_pass === false ? " · golden set FAILED" : ""}${v.prediction_error == null ? "" : " · prediction error " + fmt(v.prediction_error, 4)}</p>
        <p class="muted body">Replay before is the endpoint’s simulated baseline, not this system’s corpus number.</p>`
        : `<p class="muted body">No replay this run. The report is still the decision record.</p>`;
      const evInner = `<ul class="evidence">${(f.evidence || []).map((e) => `<li>${esc(e)}</li>`).join("")}${(d && d.evidence || []).map((e) => `<li>${esc(e)}</li>`).join("")}</ul>`;
      $("workspace").innerHTML = `
        <h2 class="claim">${esc(f.headline || f.metric)}</h2>
        <div class="chips">
          <span class="badge ${(f.severity === "high" || f.severity === "critical") ? "destructive" : "warning"}">${esc(f.severity || "")}</span>
          ${d && d.cause_class ? `<span class="badge">${esc(d.cause_class)}</span>` : ""}
          ${f.tenant ? `<span class="badge outline">${esc(f.tenant)}</span>` : ""}
        </div>
        <p class="lede"><strong>${esc(f.metric)}</strong> ${fmt(f.observed, 4)} against baseline ${fmt(f.expected, 4)}${f.baseline ? ` <span class="muted">(${esc(f.baseline)})</span>` : ""}.</p>
        <div class="block">
          <h3>Who, and how bad</h3>
          <div class="harm">
            <div><strong>${fmt(imp.conversations_affected, 0)}</strong><span>conversations</span></div>
            <div><strong>${fmt(down.would_have_resolved_at_baseline, 0)}</strong><span>would have resolved</span></div>
            <div><strong>${fmt(down.unplanned_handoffs, 0)}</strong><span>unplanned handoffs</span></div>
          </div>
          <p>${esc(f.if_nothing_changes || "—")}</p>
          <p class="muted body">${esc(who)} must act. ${esc(extra.join(" · "))}.</p>
        </div>
        <div class="block">
          <h3>Why</h3>
          <p>${esc((d && d.cause_class) || "unknown")}${d && d.confidence != null ? ` · confidence ${fmt(d.confidence, 2)}` : ""} · ${esc(ac)}.</p>
        </div>
        <div class="block">
          <h3>What we would change</h3>
          ${p ? `<p><code>${esc(p.change_type)}</code> on <code>${esc(p.target)}</code>${pd.metric ? ` · predicted ${esc(pd.metric)} ${fmt(pd.from, 4)} → ${fmt(pd.to, 4)}` : ""}</p>
                 <p>${esc(p.description || "")}</p>` : `<p class="muted body">No prescription on this finding.</p>`}
        </div>
        <div class="block">
          <h3>Replay</h3>
          ${replay}
        </div>
        ${details("Evidence and why this baseline is fair", `<p class="muted body">${esc(imp.derivation || "—")}</p>${evInner}`)}`;
    }

    function renderGate(pack) {
      if (pack.kind === "gap" || pack.kind === "dismissed" || !pack.p) {
        $("gate").innerHTML = `<p class="muted body">${pack.kind === "gap" ? "A refusal is not a change request." : pack.kind === "dismissed" ? "Nothing to ship on a dismissed lookalike." : "Nothing to approve on this finding."}</p>`;
        return;
      }
      const p = pack.p;
      const dec = p.decision || {};
      const a = p.approval || {};
      const recCls = a.verdict === "accepted" ? "success" : a.verdict === "deferred" ? "warning" : "";
      const recorded = a.verdict ? `<div class="alert ${recCls} compact">
        <p><strong>Recorded ${esc(a.verdict)}</strong></p>
        <p>${esc(a.reason || "")}</p></div>` : "";
      $("gate").innerHTML = `
        <p class="eyebrow">Your call</p>
        ${recorded}
        <p class="ask">${esc(dec.asking_approval_for || "")}</p>
        ${details("Risk if this is wrong, and when we would not ship",
          `<p><strong>Risk.</strong> ${esc(dec.risk_if_diagnosis_wrong || "—")}</p>
           <p><strong>Would not ship if.</strong> ${esc(dec.would_not_ship_if || "—")}</p>`)}
        <form id="decform">
          <input type="hidden" name="decided_by" value="operator">
          <label class="field" for="why">Reason</label>
          <textarea class="input" id="why" name="reason" required placeholder="Why this is the Monday-morning call."></textarea>
          <div class="btn-row">
            <button class="btn" type="submit" name="verdict" value="accepted">Accept</button>
            <button class="btn btn-destructive" type="submit" name="verdict" value="rejected">Reject</button>
            <button class="btn btn-outline" type="submit" name="verdict" value="deferred">Defer</button>
          </div>
          <div class="flash" id="flash"></div>
        </form>`;
      $("decform").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const verdict = (ev.submitter && ev.submitter.value) || fd.get("verdict");
        const why = $("why");
        if (!(fd.get("reason") || "").trim()) {
          why.setAttribute("aria-invalid", "true");
          $("flash").className = "flash err";
          $("flash").textContent = "A reason is required.";
          return;
        }
        why.setAttribute("aria-invalid", "false");
        const payload = {
          prescription_id: p.id,
          verdict,
          decided_by: fd.get("decided_by") || "operator",
          reason: fd.get("reason"),
        };
        const buttons = ev.target.querySelectorAll("button");
        buttons.forEach((b) => { b.disabled = true; b.classList.add("is-loading"); });
        try {
          const res = await fetch("/decision", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.detail || body.error || res.statusText);
          const next = await (await fetch("/report.json")).json();
          render(next);
        } catch (e) {
          $("flash").className = "flash err";
          $("flash").textContent = String(e.message || e);
          why.setAttribute("aria-invalid", "true");
          buttons.forEach((b) => { b.disabled = false; b.classList.remove("is-loading"); });
        }
      });
    }

    function render(rep) {
      $("hdr").textContent = `${rep.team || "—"} · ${rep.corpus || "—"}`;
      renderHonesty(rep);
      const pack = currentPack(rep);
      renderRail(rep);
      renderWorkspace(rep, pack);
      renderGate(pack);
      $("foot").textContent = "Every figure is copied from the report. A verdict updates prescriptions[].approval.";
    }

    fetch("/report.json").then((r) => {
      if (!r.ok) throw new Error("report missing — run python3 run.py first");
      return r.json();
    }).then(render).catch((e) => {
      $("workspace").innerHTML = `<p>${esc(e.message)}</p>`;
    });
  </script>
</body>
</html>
