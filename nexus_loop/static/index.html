<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F7F8F9">
  <title>Nexus Loop — one decision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
  <style>
    /*
      Light operator desk + wealth-desk type:
      sunken canvas #F7F8F9, raised rounded cards, traffic-light gate
      (Accept green #1F845A, Reject red #C9372C, Defer grey).
      Exactly two faces: --font-header (Newsreader) for claims / span
      titles / owner / ask / technical jargon (code, paths, Technical
      names); --font-chrome (Source Sans 3) for UI chrome (body, tabs,
      buttons, badges, KPI figures). No separate mono stack.
      Offline fallback: Iowan / Palatino + Segoe UI.
      Every figure is copied from loop-report.json.
      Infographics: pair bars, KPI tone strips, share-of-traffic weight,
      and state figures for all-clear / refusal — report fields only.
    */

    :root {
      --ds-text: #172b4d;
      --ds-text-subtle: #44546f;
      --ds-text-subtlest: #626f86;
      --ds-text-inverse: #ffffff;
      --ds-brand: #0c66e4;
      --ds-brand-hovered: #0055cc;
      --ds-brand-pressed: #09326c;
      --ds-danger: #c9372c;
      --ds-danger-hovered: #ae2e24;
      --ds-success: #1f845a;
      --ds-success-hovered: #0f6e4b;
      --ds-success-pressed: #164b35;
      --ds-warning: #a54800;
      --ds-information: #0c66e4;
      --ds-surface: #ffffff;
      --ds-sunken: #f7f8f9;
      --ds-neutral: #091e420f;
      --ds-neutral-hovered: #091e4224;
      --ds-selected: #e9f2ff;
      --ds-success-bg: #dcfff1;
      --ds-danger-bg: #ffeceb;
      --ds-warning-bg: #fff7d6;
      --ds-info-bg: #e9f2ff;
      --ds-border: #091e4224;
      --ds-border-focused: #388bff;
      --ds-shadow-raised: 0 1px 1px #091e4240, 0 0 1px #091e424f;
      --ds-shadow-overlay: 0 8px 12px #091e4226, 0 0 1px #091e424f;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --radius-xs: 0.125rem;
      --radius-sm: 0.25rem;
      --radius-md: 0.375rem;
      --radius-lg: 0.5rem;
      --radius-xl: 0.75rem;
      --radius-full: 999px;
      --duration: 120ms;
      --font-header: Newsreader, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --font-chrome: "Source Sans 3", "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
      --tracking-display: -0.018em;
      --tracking-body: 0.01em;
      --tracking-label: 0.08em;
      --fs-2xs: 0.6875rem;
      --fs-xs: 0.75rem;
      --fs-sm: 0.8125rem;
      --fs-base: 0.9375rem;
      --fs-lg: 1.5rem;
      --fs-xl: 1.75rem;
      --leading-tight: 1.25;
      --leading: 1.5;
      --ring: 2px;
      --ring-off: 2px;
    }
    :root {
      --color-bg: var(--ds-sunken);
      --color-fg: var(--ds-text);
      --color-surface: var(--ds-sunken);
      --color-surface-2: var(--ds-surface);
      --color-border: var(--ds-border);
      --color-muted: var(--ds-text-subtle);
      --color-accent: var(--ds-brand);
      --color-accent-hover: var(--ds-brand-hovered);
      --color-ok: var(--ds-success);
      --color-bad: var(--ds-danger);
      --color-info: var(--ds-information);
      --color-ring: var(--ds-border-focused);
      --button-bg: var(--ds-success);
      --button-fg: var(--ds-text-inverse);
      --button-hover: var(--ds-success-hovered);
      --button-bad-bg: var(--ds-danger);
      --button-bad-fg: var(--ds-text-inverse);
      --button-ghost-bg: var(--ds-surface);
      --button-ghost-fg: var(--ds-text);
      --input-bg: var(--ds-surface);
      --input-border: var(--ds-border);
      --input-fg: var(--ds-text);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow: hidden;
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-chrome);
      font-size: var(--fs-base);
      line-height: var(--leading);
      letter-spacing: var(--tracking-body);
    }
    button, input, textarea { font: inherit; touch-action: manipulation; }
    a { color: var(--color-accent); }
    code, .mono {
      font-family: var(--font-header);
      font-size: var(--fs-xs);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .num { font-variant-numeric: tabular-nums; }

    .skip {
      position: absolute; left: -999px; top: 0;
      background: var(--color-accent); color: var(--button-fg);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
    }
    .skip:focus { left: var(--space-2); top: var(--space-2); z-index: 20; }

    .app {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
    }
    header.top {
      display: flex;
      flex-wrap: wrap;
      align-items: start;
      gap: var(--space-3) var(--space-4);
      padding: var(--space-3) var(--space-5);
      border-bottom: 1px solid var(--color-border);
      background: var(--ds-surface);
      min-width: 0;
    }
    .brand-wrap { display: flex; align-items: center; gap: var(--space-2); }
    .mark {
      width: 0.75rem; height: 0.75rem;
      background: var(--ds-brand);
      border-radius: var(--radius-sm);
    }
    header.top .brand {
      font-family: var(--font-chrome);
      font-weight: 600;
      letter-spacing: var(--tracking-display);
      margin: 0;
      font-size: 1rem;
    }
    header.top .meta {
      color: var(--ds-text-subtlest);
      font-size: var(--fs-xs);
    }
    header.top .spacer { flex: 1 1 0; min-width: 0; }
    .honesty {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end;
      gap: var(--space-2);
      flex: 1 1 18rem;
      min-width: 0;
      font-size: var(--fs-xs); color: var(--ds-text-subtle);
    }
    .honesty .badge { max-width: 100%; }
    .honesty details { min-width: 0; }
    .honesty details summary { cursor: pointer; color: var(--ds-brand); font-weight: 600; white-space: nowrap; }
    .honesty details .note {
      margin: var(--space-2) 0 0;
      max-width: 72ch;
      color: var(--color-fg);
      background: var(--ds-sunken);
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-4);
    }
    .gen-wrap {
      display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);
      flex: 0 1 auto;
    }
    .btn-gen {
      width: auto;
      min-height: 2rem;
      padding: 0.25rem var(--space-3);
      background: var(--ds-surface);
      color: var(--ds-text);
      border: 1px solid var(--ds-border);
      border-radius: var(--radius-md);
      font-size: var(--fs-xs);
      font-weight: 600;
      cursor: pointer;
    }
    .btn-gen:hover { background: var(--ds-neutral-hovered); }
    .btn-gen:focus-visible {
      outline: none;
      box-shadow: 0 0 0 var(--ring-off) var(--ds-surface),
                  0 0 0 calc(var(--ring-off) + var(--ring)) var(--ds-border-focused);
    }
    .btn-gen:disabled { opacity: 0.5; pointer-events: none; }
    .gen-flash { font-size: var(--fs-2xs); color: var(--ds-text-subtle); min-width: 0; }
    .gen-flash.err { color: var(--ds-danger); }
    .gen-flash.ok { color: var(--ds-success); }

    .shell {
      display: grid;
      grid-template-columns: minmax(16rem, 20rem) minmax(0, 1fr) minmax(17rem, 20rem);
      gap: var(--space-4);
      padding: var(--space-4);
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      align-items: stretch;
      background: var(--ds-sunken);
    }
    @media (max-width: 1100px) {
      .shell {
        grid-template-columns: minmax(14rem, 17rem) minmax(0, 1fr);
        grid-template-rows: minmax(12rem, 1fr) auto;
      }
      .gate-col {
        grid-column: 1 / -1;
        position: static;
        max-height: min(14rem, 36vh);
      }
    }
    @media (max-width: 720px) {
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(10rem, 30%) minmax(12rem, 1fr) minmax(8rem, 28%);
        padding: var(--space-2);
      }
      .list-col { max-height: none; min-height: 10rem; }
      .gate-col { max-height: none; }
    }

    .list-col {
      display: flex;
      flex-direction: column;
      background: var(--ds-surface);
      overflow: hidden;
      min-width: 14rem;
      min-height: 0;
      border: 1px solid var(--ds-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--ds-shadow-raised);
    }
    .mode-bar {
      flex: none;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      background: var(--ds-surface);
      border-bottom: 1px solid var(--color-border);
      min-width: 0;
    }
    @media (max-width: 720px) {
      .mode-bar {
        gap: var(--space-1);
        padding: var(--space-2);
      }
    }
    .list-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: var(--space-2) 0;
    }
    .seg {
      appearance: none; border: 0; cursor: pointer;
      background: transparent;
      color: var(--ds-text-subtle);
      font-size: var(--fs-sm);
      font-weight: 600;
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius-md);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      line-height: 1.2;
      min-height: 2.25rem;
      flex: unset;
      --seg-accent: var(--ds-danger);
      --seg-fill: var(--ds-danger-bg);
    }
    .seg[data-filter="ignored"] {
      --seg-accent: var(--ds-text-subtle);
      --seg-fill: var(--ds-neutral);
    }
    .seg[data-filter="refused"] {
      --seg-accent: var(--ds-text-subtlest);
      --seg-fill: var(--ds-neutral);
    }
    .seg:hover { background: var(--ds-surface); color: var(--ds-text); }
    .seg.is-on {
      background: var(--seg-fill);
      color: var(--seg-accent);
      box-shadow: inset 0 3px 0 var(--seg-accent);
    }
    .seg:focus-visible {
      outline: none;
      box-shadow: 0 0 0 var(--ring) var(--ds-border-focused);
    }
    .seg.is-on:focus-visible {
      box-shadow: inset 0 3px 0 var(--seg-accent),
                  0 0 0 var(--ring) var(--ds-border-focused);
    }
    .trace {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: var(--space-2);
      align-items: center;
      width: calc(100% - 0.5rem);
      margin: 0 var(--space-1);
      text-align: left;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      color: inherit;
      padding: 0.45rem 0.6rem;
      cursor: pointer;
      content-visibility: auto;
      contain-intrinsic-size: auto 2.75rem;
    }
    .trace:hover { background: var(--ds-neutral-hovered); }
    .trace.is-on {
      background: var(--ds-selected);
      border-color: transparent;
      box-shadow: inset 3px 0 0 var(--ds-brand);
    }
    .trace.is-on.ok {
      background: var(--ds-success-bg);
      box-shadow: inset 3px 0 0 var(--ds-success);
    }
    .trace.is-on.miss {
      background: var(--ds-neutral);
      box-shadow: inset 3px 0 0 var(--ds-text-subtle);
    }
    .trace:focus-visible {
      outline: none;
      box-shadow: 0 0 0 var(--ring) var(--ds-border-focused);
    }
    .trace.is-on:focus-visible {
      box-shadow: inset 3px 0 0 var(--ds-brand), 0 0 0 var(--ring) var(--ds-border-focused);
    }
    .trace.is-on.ok:focus-visible {
      box-shadow: inset 3px 0 0 var(--ds-success), 0 0 0 var(--ring) var(--ds-border-focused);
    }
    .trace.is-on.miss:focus-visible {
      box-shadow: inset 3px 0 0 var(--ds-text-subtle), 0 0 0 var(--ring) var(--ds-border-focused);
    }
    .dot {
      width: 0.45rem; height: 0.45rem; min-height: 0;
      margin-top: 0;
      border-radius: var(--radius-full);
      background: var(--ds-text-subtlest);
    }
    .dot.bad { background: var(--ds-danger); }
    .dot.warn { background: var(--ds-warning); }
    .dot.ok { background: var(--ds-success); }
    .dot.miss { background: var(--ds-text-subtle); }
    .t-main { min-width: 0; overflow: hidden; }
    .t-title {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-family: var(--font-chrome);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: var(--tracking-display);
      line-height: 1.25;
      max-height: 2.6em;
      white-space: normal;
      overflow: hidden;
      overflow-wrap: break-word;
    }
    .t-sub {
      display: block;
      font-size: var(--fs-2xs);
      color: var(--color-muted);
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .t-stat {
      font-size: var(--fs-2xs);
      color: var(--color-muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: normal;
      max-width: 6.75rem;
    }
    .t-stat .badge { white-space: normal; text-align: center; }

    .detail {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 12rem;
      overflow: hidden;
      padding: 0;
      background: var(--ds-surface);
      border: 1px solid var(--ds-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--ds-shadow-raised);
    }
    .story-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: var(--space-5) var(--space-5) var(--space-4);
    }
    .tech-foot {
      flex: none;
      max-height: 45%;
      overflow-x: auto;
      overflow-y: auto;
      padding: var(--space-3) var(--space-5) var(--space-4);
      border-top: 1px solid var(--ds-border);
      background: var(--ds-sunken);
    }
    .tech-head {
      margin: 0 0 var(--space-2);
      font-family: var(--font-chrome);
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--ds-brand);
      letter-spacing: var(--tracking-body);
    }
    .kicker {
      font-size: var(--fs-2xs);
      font-weight: 700;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      margin: 0 0 var(--space-2);
    }
    .kicker.ok { color: var(--ds-text-subtle); }
    .kicker.miss { color: var(--ds-text-subtlest); }
    .kicker.bad { color: var(--ds-danger); }
    .path {
      font-family: var(--font-header);
      font-size: var(--fs-2xs);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: var(--ds-text-subtlest);
      margin: 0 0 var(--space-2);
    }
    h1.claim {
      font-family: var(--font-header);
      font-size: var(--fs-xl);
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: var(--tracking-display);
      text-wrap: pretty;
      margin: 0 0 var(--space-3);
      color: var(--ds-text);
    }
    .chips { display: flex; flex-wrap: wrap; gap: var(--space-1); margin: 0 0 var(--space-4); }
    .badge {
      display: inline-flex; align-items: center;
      font-size: var(--fs-2xs);
      font-weight: 600;
      border: 0;
      background: var(--ds-neutral);
      color: var(--ds-text-subtle);
      border-radius: var(--radius-sm);
      padding: 0.15rem 0.5rem;
    }
    .badge.bad { color: var(--ds-danger); background: var(--ds-danger-bg); }
    .badge.ok { color: var(--ds-success); background: var(--ds-success-bg); }
    .badge.warn { color: var(--ds-warning); background: var(--ds-warning-bg); }
    .badge.ghost { color: var(--ds-text-subtlest); background: var(--ds-neutral); }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: var(--space-3);
      margin: 0 0 var(--space-4);
      align-items: stretch;
    }
    @media (max-width: 1200px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 720px) { .kpis { grid-template-columns: 1fr 1fr; } }
    .kpi {
      display: grid;
      grid-template-rows: auto minmax(2rem, auto) auto;
      gap: 0.15rem;
      border: 0;
      background: var(--ds-sunken);
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-4) var(--space-3) calc(var(--space-4) + 2px);
      min-width: 0;
      box-shadow: inset 5px 0 0 var(--ds-border);
    }
    .kpi.info {
      background: var(--ds-info-bg);
      box-shadow: inset 5px 0 0 var(--ds-information);
    }
    .kpi.info .v { color: var(--ds-information); }
    .kpi.warn {
      background: var(--ds-warning-bg);
      box-shadow: inset 5px 0 0 var(--ds-warning);
    }
    .kpi.warn .v { color: var(--ds-warning); }
    .kpi.bad {
      background: var(--ds-danger-bg);
      box-shadow: inset 5px 0 0 var(--ds-danger);
    }
    .kpi.bad .v { color: var(--ds-danger); }
    .kpi.ok {
      background: var(--ds-success-bg);
      box-shadow: inset 5px 0 0 var(--ds-success);
    }
    .kpi.ok .v { color: var(--ds-success); }
    .kpi .k {
      font-size: var(--fs-2xs);
      font-weight: 600;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--ds-text-subtlest);
      line-height: 1.2;
    }
    .kpi .v {
      font-family: var(--font-chrome);
      font-size: clamp(1.35rem, 1.1rem + 0.6vw, 1.85rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: var(--tracking-display);
      overflow-wrap: anywhere;
      color: var(--ds-text);
      align-self: center;
      line-height: 1.1;
    }
    .kpi .s {
      font-size: var(--fs-2xs);
      color: var(--ds-text-subtlest);
      align-self: end;
      line-height: 1.25;
    }

    .impact-viz {
      display: grid;
      gap: var(--space-3);
      margin: 0 0 var(--space-5);
    }
    .share-weight {
      background: var(--ds-sunken);
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-4);
    }
    .share-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: var(--space-2);
      margin: 0 0 var(--space-2);
      align-items: baseline;
    }
    .share-lbl {
      font-size: var(--fs-2xs);
      font-weight: 600;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--ds-text-subtlest);
    }
    .share-val {
      font-family: var(--font-sans);
      font-size: var(--fs-sm);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--ds-text);
    }
    .share-track {
      height: 14px;
      background: var(--ds-neutral);
      border-radius: var(--radius-sm);
      overflow: hidden;
      position: relative;
    }
    .share-track > i {
      display: block;
      height: 100%;
      background: var(--ds-information);
      border-radius: var(--radius-sm);
      transform-origin: left center;
      animation: bar-grow 480ms ease-out both;
    }
    .share-track::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent calc(10% - 1px),
        #091e4214 calc(10% - 1px),
        #091e4214 10%
      );
      pointer-events: none;
    }

    .lede { margin: 0 0 var(--space-3); max-width: 52ch; font-size: var(--fs-sm); line-height: 1.4; }
    .defn { margin: 0 0 var(--space-5); max-width: 68ch; font-size: var(--fs-xs); color: var(--ds-text-subtle); }
    .lead-ev {
      margin: 0 0 var(--space-4);
      max-width: 68ch;
      font-size: var(--fs-sm);
      padding: var(--space-3) var(--space-4);
      background: var(--ds-info-bg);
      border-radius: var(--radius-lg);
      border-left: 0;
    }
    .who {
      margin: 0 0 var(--space-5);
      color: var(--color-fg);
      font-size: var(--fs-base);
      max-width: 68ch;
      padding: var(--space-4);
      background: var(--ds-sunken);
      border: 0;
      border-radius: var(--radius-lg);
    }
    .who .owner {
      font-family: var(--font-header);
      font-weight: 500;
      font-size: 1.0625rem;
      letter-spacing: var(--tracking-display);
      margin: 0 0 var(--space-2);
    }
    .who .inaction { margin: 0; }
    .tech {
      display: grid;

  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    };
    const fmt = (n, d = 2) => (n === null || n === undefined) ? "—" : Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
    const pct = (n) => (n === null || n === undefined) ? "—" : (100 * n).toFixed(1) + "%";
    const cohortPath = (f) => {
      const c = (f && f.cohort) || {};
      const bits = [f && f.tenant, c.intent || c.agent_id, c.tool].filter(Boolean);
      return bits.length ? "/" + bits.join("/") : "/";
    };
    const windowLbl = (w) => {
      if (!w) return "";
      const a = w.from_day, b = w.to_day;
      if (a == null && b == null) return "";
      return `days ${a ?? "—"}–${b ?? "—"}`;
    };
    const AUDIENCE = {
      agent_builder: "Agent team",
      platform_owner: "Platform team",
      business_owner: "Business owner",
    };
    const METRIC = {
      resolution_rate: "Share we finished",
      turns_to_resolve: "Turns to finish",
      tool_p95_latency_ms: "Tool wait time",
      containment_rate: "Share we handled end to end",
      quality_score: "Scorecard quality",
    };
    const CAUSE = {
      "tool.contract_break": "The tool said success but sent an empty answer",
      "kb.gap": "The knowledge base has nothing for this question",
      "prompt.regression": "The prompt started taking more turns",
      "traffic_mix": "Traffic mix, not quality",
      "load": "A short load spike",
      "judge_change": "The scorecard changed, not the agent",
    };
    const audienceLbl = (ids) => (ids || []).map((x) => AUDIENCE[x] || x).join(", ") || "—";
    const metricLbl = (id) => {
      if (METRIC[id]) return METRIC[id];
      const s = String(id || "").replace(/_/g, " ").trim();
      return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
    };
    const causeLbl = (id) => CAUSE[id] || String(id || "unknown").replace(/[._]/g, " ");
    const PHRASE_ENGLISH = [
      ["tool_call p95 duration_ms", "Tool wait time"],
      ["tool p95 latency", "Tool wait time"],
      ["duration_ms", "wait (ms)"],
      ["sessions/day", "sessions a day"],
      ["timeout rate", "timeouts"],
      ["platform owner", "Platform team"],
      ["agent builder", "Agent team"],
      ["business owner", "Business owner"],
      ["judge_version", "scorecard version"],
      ["config_timeline", "setup timeline"],
      ["quality_rubric", "quality rubric"],
      ["agent_kind", "agent kind"],
      ["tool_call", "tool call"],
      ["quality_score", "Scorecard quality"],
      ["aggregate containment", "Share we handled end to end"],
      ["containment rate", "Share we handled end to end"],
      ["Resolution is flat", "Share we finished is flat"],
      ["volume runs at", "Traffic ran at"],
      ["tool telemetry", "tool measurements"],
      ["coverage-limited to the", "only from the"],
    ];
    const CAUSE_AUDIENCE = {
      load: ["platform_owner"],
      traffic_mix: ["business_owner"],
      judge_change: ["platform_owner"],
      "tool.outage": ["platform_owner"],
      "routing.error": ["platform_owner"],
      "kb.gap": ["agent_builder", "business_owner"],
      "tool.contract_break": ["agent_builder", "platform_owner"],
      "prompt.regression": ["agent_builder"],
      "model.change": ["agent_builder", "platform_owner"],
      unknown: ["agent_builder", "platform_owner"],
    };
    function audienceFor(pack) {
      const f = pack && pack.f;
      if (f && f.audience && f.audience.length) return audienceLbl(f.audience);
      const cause = pack && pack.d && pack.d.cause_class;
      return audienceLbl(CAUSE_AUDIENCE[cause] || []);
    }
    const showVal = (n) => (typeof n === "number" && n <= 1 && n >= 0 ? pct(n) : fmt(n, 4));
    function toManagerEnglish(s) {
      if (s == null) return "";
      let out = String(s);
      const pairs = [];
      [METRIC, CAUSE, AUDIENCE].forEach((map) => {
        Object.keys(map).forEach((k) => pairs.push([k, map[k]]));
      });
      PHRASE_ENGLISH.forEach((row) => pairs.push(row));
      pairs.sort((a, b) => b[0].length - a[0].length);
      const seen = new Set();
      pairs.forEach(([k, v]) => {
        const key = k.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        const re = new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
        out = out.replace(re, v);
      });
      return out.replace(/\s*->\s*/g, " → ");
    }
    const gapClaim = (g) => {
      if (!g) return "We will not invent this number";
      if (g.ask_id === "A11") return "We will not invent a failover rate";
      if (g.ask_id === "A09") return "We will not invent why people left";
      if (g.ask_id === "A02") return "We will not break this down by customer";
      return "We will not invent this number";
    };
    const GAP_LEDE = {
      A11: "Failover does not exist here. There is no rate to show.",
      A09: "We count who left. We will not invent why.",
      A02: "Too many distinct customers to split this list.",
    };
    function firstBeat(s, max) {
      const t = String(s || "").replace(/\s+/g, " ").trim();
      if (!t) return "";
      const cut = t.split(/(?<=[.!?])\s+|:\s+|;\s+/)[0] || t;
      const cap = max || 140;
      return cut.length <= cap ? cut : cut.slice(0, cap - 1) + "…";
    }
    function gapLede(g) {
      if (g && GAP_LEDE[g.ask_id]) return GAP_LEDE[g.ask_id];
      return firstBeat(g && g.why, 140) || "We will not invent this number.";
    }
    const replayLbl = (v) => {
      if (!v) return "No test this run";
      if (v.verdict === "improved") return "The test got better";
      if (v.verdict === "no_effect") return "The test did not move";
      return v.verdict || "Test result";
    };
    function techBlock(rows) {
      const bits = (rows || []).filter((r) => r && r.v != null && String(r.v) !== "");
      if (!bits.length) return "";
      return `<footer class="tech-foot">
        <h2 class="tech-head">Technical names</h2>
        ${bits.map((r) =>
          `<div class="tech"><span class="tk">${esc(r.k)}</span><code translate="no">${esc(r.v)}</code></div>`
        ).join("")}
      </footer>`;
    }
    function pinStoryLayout(el) {
      if (!el || el.querySelector(".story-scroll")) return;
      const foot = el.querySelector(".tech-foot");
      const wrap = document.createElement("div");
      wrap.className = "story-scroll";
      Array.from(el.childNodes).forEach((n) => {
        if (n !== foot) wrap.appendChild(n);
      });
      if (foot) el.insertBefore(wrap, foot);
      else el.appendChild(wrap);
    }
    function matchStandard(rep, f) {
      if (!f) return null;
      const c = f.cohort || {};
      return (rep.standard || []).find((s) => {
        if (s.tenant !== f.tenant || s.metric !== f.metric) return false;
        const sc = s.cohort || {};
        return Object.keys(sc).every((k) => sc[k] == null || sc[k] === c[k]);
      }) || null;
    }
    function standardLine(s, metric) {
      if (!s) return "";
      const rate = typeof s.median === "number" && s.median <= 1;
      const mid = rate ? pct(s.median) : fmt(s.median, 1);
      const best = rate ? pct(s.best) : fmt(s.best, 1);
      const what = metricLbl(metric || s.metric);
      return `Healthy conversations here sit around ${mid} ${what} (best ${best}).`;
    }
    const rateBar = (n, cls) => {
      const w = (n == null || Number.isNaN(Number(n))) ? 0 : Math.max(2, Math.min(100, Number(n) * 100));
      return `<span class="track"><i class="${cls || ""}" style="width:${w}%"></i></span>`;
    };
    function deltaTone(a, b, higherIsWorse) {
      const d = Number(a) - Number(b);
      if (!Number.isFinite(d) || d === 0) return "ok";
      const worse = higherIsWorse ? d > 0 : d < 0;
      return worse ? "bad" : "ok";
    }
    function formatDelta(a, b, asRate) {
      const d = Number(a) - Number(b);
      if (!Number.isFinite(d)) return "";
      const abs = Math.abs(d);
      const body = asRate ? pct(abs) : fmt(abs, abs >= 10 ? 1 : 4);
      if (d === 0) return "No change";
      return (d > 0 ? "+" : "−") + body;
    }
    function pairBars(aLbl, aVal, bLbl, bVal, aCls, bCls, title, forceTone) {
      if (aVal == null || bVal == null) return "";
      const a = Number(aVal), b = Number(bVal);
      const asRate = a >= 0 && b >= 0 && a <= 1 && b <= 1;
      const max = Math.max(a, b, asRate ? 1 : 0.0001);
      const show = (n) => asRate ? pct(n) : fmt(n, 4);
      const higherIsWorse = aCls === "bad" ? (a > b) : (!asRate && Math.max(a, b) > 1);
      const tone = forceTone || ((aCls === "ok" && bCls === "ok") ? "ok" : deltaTone(a, b, higherIsWorse));
      const delta = formatDelta(a, b, asRate);
      const aria = `${aLbl} ${show(a)}, ${bLbl} ${show(b)}${delta ? ", delta " + delta : ""}`;

        </div>
        <div class="who">
          <p class="owner">${esc(who)} needs to act.</p>
          <p class="inaction">${esc(f.if_nothing_changes || "")}</p>
        </div>
        ${ev0 ? `<p class="lead-ev">${esc(ev0)}</p>` : ""}
        <div class="spans">
          <div class="span">
            <span class="kind">What changed</span>
            <div class="body"><h2 class="name">${esc(metricLbl(f.metric))}</h2>${stdHint}<div class="hint">${esc(f.baseline || "Baseline named in the report")}</div>${observeBars}</div>
            <span class="val">${showVal(f.observed)}</span>
          </div>
          <div class="span">
            <span class="kind">Why we think so</span>
            <div class="body"><h2 class="name">${esc(causeLbl(d && d.cause_class))}${d && d.confidence != null ? ` · confidence ${fmt(d.confidence, 2)}` : ""}</h2><div class="hint">${esc(changeLine(ac))}</div></div>
            <span class="val">${ac && ac.day != null ? `day ${esc(ac.day)}` : "—"}</span>
          </div>
          <div class="span">
            <span class="kind">What we would change</span>
            <div class="body">${p ? `<h2 class="name">${esc(p.target)}</h2><div class="hint">${esc(p.description || "")}</div>${predBars}` : `<h2 class="name">No change proposed</h2>`}</div>
            <span class="val">${pd.metric ? esc(metricLbl(pd.metric)) : "—"}</span>
          </div>
          <div class="span">
            <span class="kind">Did the test help</span>
            <div class="body">${v ? `<h2 class="name">${esc(replayLbl(v))}${v.golden_set_pass === true ? " · known-good conversations still passed" : v.golden_set_pass === false ? " · a known-good conversation got worse" : ""}</h2>
              <div class="hint">The test’s “before” is simulated, not our measured number.${v.prediction_error == null ? "" : " Gap vs prediction " + fmt(v.prediction_error, 4)}.</div>${replayBars}` : `<h2 class="name">No test this run</h2><div class="hint">The report is still the decision record.</div>`}</div>
            <span class="val">${v ? showVal(v.after) : "—"}</span>
          </div>
        </div>
        ${details("More evidence and why this baseline is fair", `<p class="idle">${esc(extra.join(" · "))}. ${esc(imp.derivation || "—")}</p>${evInner}`)}
        ${techBlock([
          { k: "cause", v: d && d.cause_class },
          { k: "metric", v: f.metric },
          { k: "change", v: p && p.change_type },
          { k: "attributed kind", v: ac && ac.kind },
          { k: "test run", v: v && v.replay_run_id },
          { k: "finding", v: f.id },
        ])}`;
    }

    function renderDetail(rep, pack) {
      if (pack.kind === "gap") renderGap(pack.gap || {});
      else if (!pack.f) $("detail").innerHTML = `<p class="idle">No findings in this report.</p>`;
      else if (pack.kind === "dismissed") renderDismissed(pack);
      else renderRegression(rep, pack);
      pinStoryLayout($("detail"));
    }

    function idleGateCopy(pack) {
      const g = (pack && pack.gap) || {};
      const notMeasurable = pack && pack.kind === "gap" && (g.ask_id === "A11" || g.verdict === "NOT_MEASURABLE");
      if (notMeasurable) {
        return g.ask_id === "A11"
          ? "Nothing to approve. We will not invent a failover rate."
          : "Nothing to approve. We will not invent this number.";
      }
      if (pack && pack.kind === "gap") {
        return "Nothing to approve. " + gapClaim(g) + ".";
      }
      if (pack && (pack.kind === "dismissed" || !pack.p)) {
        return "Nothing to approve. This is not a problem.";
      }
      return "";
    }
    function renderGate(pack) {
      if (pack.kind === "gap" || pack.kind === "dismissed" || !pack.p) {
        const tone = pack.kind === "dismissed" ? "ok" : pack.kind === "gap" ? "miss" : "";
        $("gate").innerHTML = `<div class="alert ${tone}"><p class="idle">${esc(idleGateCopy(pack))}</p></div>`;
        return;
      }
      const p = pack.p;
      const dec = p.decision || {};
      const a = p.approval || {};
      const recCls = a.verdict === "accepted" ? "ok" : a.verdict === "rejected" ? "bad" : a.verdict === "deferred" ? "warn" : "";
      const recorded = a.verdict ? `<div class="alert ${recCls}"><p><strong>Recorded ${esc(a.verdict)}</strong></p><p>${esc(a.reason || "")}</p></div>` : "";
      const risk = (dec.risk_if_diagnosis_wrong || "").trim();
      const riskLine = risk.length > 160 ? risk.slice(0, 157) + "…" : risk;
      $("gate").innerHTML = `
        <p class="eyebrow">Your decision</p>
        ${recorded}
        <div data-testid="signed-copy-slot"></div>
        <p class="ask">${esc(dec.asking_approval_for || "")}</p>
        ${riskLine ? `<p class="risk"><strong>If we are wrong.</strong> ${esc(riskLine)}</p>` : ""}
        ${details("Full risk and when we would not ship",
          `<p><strong>Risk.</strong> ${esc(dec.risk_if_diagnosis_wrong || "—")}</p>
           <p><strong>Would not ship if.</strong> ${esc(dec.would_not_ship_if || "—")}</p>`)}
        <form id="decform">
          <input type="hidden" name="decided_by" value="operator">
          <label class="field" for="why">Reason</label>
          <textarea class="input" id="why" name="reason" required maxlength="4000" autocomplete="off" placeholder="Why you are making this call…"></textarea>
          <div class="btn-row">
            <button class="btn btn-ok" type="submit" name="verdict" value="accepted">Accept</button>
            <button class="btn btn-bad" type="submit" name="verdict" value="rejected">Reject</button>
            <button class="btn btn-ghost" type="submit" name="verdict" value="deferred">Defer</button>
          </div>
          <div class="flash" id="flash" role="status" aria-live="polite"></div>
        </form>`;
      const slotEl = $("gate").querySelector('[data-testid="signed-copy-slot"]');
      if (slotEl && window.SignedCopy && window.SignedCopy.ui && typeof window.SignedCopy.ui.render === "function") {
        window.SignedCopy.ui.render(slotEl, pack.f);
      }
      $("decform").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const verdict = (ev.submitter && ev.submitter.value) || fd.get("verdict");
        const why = $("why");
        if (!(fd.get("reason") || "").trim()) {
          why.setAttribute("aria-invalid", "true");
          $("flash").className = "flash err";
          $("flash").textContent = "A reason is required.";
          why.focus();
          return;
        }
        why.setAttribute("aria-invalid", "false");
        const payload = {
          prescription_id: p.id,
          verdict,
          decided_by: fd.get("decided_by") || "operator",
          reason: fd.get("reason"),
        };
        const buttons = ev.target.querySelectorAll("button");
        buttons.forEach((b) => { b.disabled = true; });
        $("flash").className = "flash";
        $("flash").textContent = "Saving…";
        try {
          await api("/decision", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          const next = await api("/report.json");
          window.__rep = next;
          render(next);
        } catch (e) {
          $("flash").className = "flash err";
          $("flash").textContent = String(e.message || e);
          why.setAttribute("aria-invalid", "true");
          buttons.forEach((b) => { b.disabled = false; });
        }
      });
    }

    function render(rep, opts) {
      $("hdr").textContent = `${rep.team || "—"} · ${rep.corpus || "—"}`;
      renderHonesty(rep);
      const pack = currentPack(rep);
      if (pack.kind === "gap") select("gap:" + (pack.gap && pack.gap.ask_id));
      else if (pack.f) select(pack.f.id);
      if (opts && opts.alignFilter) listFilter = filterForPack(pack);
      renderModeBar(rep);
      renderList(rep);
      renderDetail(rep, pack);
      renderGate(pack);
      $("foot").textContent = "Every figure is copied from the report. Your decision is written into the report.";
    }

    window.addEventListener("hashchange", () => {
      selectedKey = keyFromHash();
      if (window.__rep) render(window.__rep, { alignFilter: true });
    });

    async function generateReport() {
      const btn = $("gen-btn");
      const flash = $("gen-flash");
      if (!btn || !flash) return;
      btn.disabled = true;
      flash.className = "gen-flash";
      flash.textContent = "Generating…";
      try {
        const summary = await api("/generate", { method: "POST", body: "{}", timeoutMs: 200000 });
        const next = await api("/report.json");
        window.__rep = next;
        render(next, { alignFilter: true });
        const nVer = summary && summary.verifications != null ? summary.verifications : "—";
        flash.className = "gen-flash ok";
        flash.textContent = `Updated · ${summary.findings || 0} findings · ${nVer} tests`;
      } catch (e) {
        flash.className = "gen-flash err";
        flash.textContent = String(e.message || e);
      } finally {
        btn.disabled = false;
      }
    }

    $("gen-btn").addEventListener("click", generateReport);

    api("/health").then((h) => {
      if (h && h.generate === false) {
        $("gen-flash").textContent = "Enable with --allow-generate";
      }
    }).catch(() => {});

    api("/report.json").then((rep) => {
      window.__rep = rep;
      render(rep, { alignFilter: true });
    }).catch((e) => {
      $("detail").innerHTML = `<p>${esc(e.message)}</p>`;
    });

    window.NexusDesk = Object.freeze({
      selectedFinding() {
        const rep = window.__rep;
        if (!rep) return null;
        const pack = currentPack(rep);
        return pack && pack.f ? pack.f : null;
      },
      bucketOf(finding) {
        const rep = window.__rep;
        if (!rep || !finding) return null;
        return filterForPack(packForFinding(rep, finding));
      },
      findingsIn(bucket) {
        const rep = window.__rep;
        if (!rep) return [];
        const findings = rep.findings || [];
        if (bucket === "open") return findings.filter((f) => f.is_regression);
        if (bucket === "ignored") return findings.filter((f) => !f.is_regression);
        if (bucket === "refused") return [];
        return [];
      },
      bucketCountText(bucket) {
        const rep = window.__rep;
        if (!rep) return null;
        if (bucket === "open") return String((rep.findings || []).filter((f) => f.is_regression).length);
        if (bucket === "ignored") return String((rep.findings || []).filter((f) => !f.is_regression).length);
        if (bucket === "refused") return String((rep.gaps || []).length);
        return null;
      },
      findingUrl(finding) {
        if (!finding || !finding.id) return null;
        return location.origin + location.pathname + location.search + "#" + finding.id;
      },
      runLabelText() {
        const rep = window.__rep;
        if (!rep) return null;
        const team = rep.team || "";
        const corpus = rep.corpus || "";
        if (!team && !corpus) return null;
        return `${team || "—"} · ${corpus || "—"}`;
      },
      claimText(finding) {
        if (!finding) return null;
        return finding.headline || metricLbl(finding.metric) || null;
      },
      metricLabel(finding) {
        if (!finding) return null;
        const s = metricLbl(finding.metric);
        return s || null;
      },
      observedText(finding) {
        if (!finding || finding.observed == null) return null;
        return showVal(finding.observed);
      },
      expectedText(finding) {
        if (!finding || finding.expected == null) return null;
        return showVal(finding.expected);
      },
      affectedFigureText(finding) {
        if (!finding) return null;
        const n = (finding.impact || {}).conversations_affected;
        if (n == null) return null;
        return fmt(n, 0);
      },
      causeText(finding) {
        const rep = window.__rep;
        if (!rep || !finding) return null;
        const d = packForFinding(rep, finding).d;
        if (!d || d.cause_class == null) return null;
        return causeLbl(d.cause_class);
      },
      configChangeText(finding) {
        const rep = window.__rep;
        if (!rep || !finding) return null;
        const d = packForFinding(rep, finding).d;
        const ac = d && d.attributed_change;
        return changeLine(ac);
      },
      changeTargetText(finding) {
        const rep = window.__rep;
        if (!rep || !finding) return null;
        const p = packForFinding(rep, finding).p;
        return (p && p.target != null && String(p.target) !== "") ? String(p.target) : null;
      },
      changeDescriptionText(finding) {
        const rep = window.__rep;
        if (!rep || !finding) return null;
        const p = packForFinding(rep, finding).p;
        return (p && p.description != null && String(p.description) !== "") ? String(p.description) : null;
      },
      replayText(finding) {
        const rep = window.__rep;
        if (!rep || !finding) return null;
        const v = packForFinding(rep, finding).v;
        if (!v) return null;
        if (v.before == null || v.after == null) return null;
        return { before: showVal(v.before), after: showVal(v.after) };
      },
      riskText(finding) {
        const rep = window.__rep;
        if (!rep || !finding) return null;
        const p = packForFinding(rep, finding).p;
        const risk = p && p.decision && p.decision.risk_if_diagnosis_wrong;
        if (risk == null || String(risk) === "") return null;
        return String(risk);
      },
      ifNothingChangesText(finding) {
        if (!finding) return null;
        const t = finding.if_nothing_changes;
        if (t == null || String(t) === "") return null;
        return String(t);
      },
      ownerText(finding) {
        if (!finding) return null;
        const who = audienceLbl(finding.audience);
        return who + " needs to act.";
      },
      technicalNames(finding) {
        const rep = window.__rep;
        if (!rep || !finding) return [];
        const pack = packForFinding(rep, finding);
        const { f, d, p, v } = pack;
        let rows;
        if (pack.kind === "dismissed") {
          rows = [
            { k: "cause", v: d && d.cause_class },
            { k: "metric", v: f.metric },
            { k: "finding", v: f.id },
          ];
        } else {
          const ac = d && d.attributed_change;
          rows = [
            { k: "cause", v: d && d.cause_class },
            { k: "metric", v: f.metric },
            { k: "change", v: p && p.change_type },
            { k: "attributed kind", v: ac && ac.kind },
            { k: "test run", v: v && v.replay_run_id },
            { k: "finding", v: f.id },
          ];
        }
        return rows.filter((r) => r && r.v != null && String(r.v) !== "").map((r) => String(r.v));
      },
      coverageText() {
        const rep = window.__rep;
        if (!rep) return null;
        const metrics = rep.metrics || [];
        const pick = ["A01", "A04"].map((id) => metrics.find((x) => x.ask_id === id)).filter(Boolean);
        const judged = metrics.find((x) => x.fidelity === "judged");
        if (judged && !pick.includes(judged)) pick.push(judged);
        for (const m of pick) {
          if (m && m.coverage && m.coverage.value != null) {
            return "coverage " + pct(m.coverage.value);
          }
        }
        for (const m of metrics) {
          if (m && m.coverage && m.coverage.value != null) {
            return "coverage " + pct(m.coverage.value);
          }
        }
        return null;
      },
      refusalClaims() {
        const rep = window.__rep;
        if (!rep) return [];
        const gaps = rep.gaps || [];
        const a11 = gaps.filter((g) => g.ask_id === "A11");
        const rest = gaps.filter((g) => g.ask_id !== "A11");
        return [...a11, ...rest].map(gapClaim);
      },
      decisionFor(finding) {
        const rep = window.__rep;
        if (!rep || !finding) return null;
        const p = packForFinding(rep, finding).p;
        const a = p && p.approval;
        if (!a || !a.verdict) return null;
        return {
          verdict: a.verdict,
          reason: a.reason,
          recordedAtText: null,
        };
      },
    });
  </script>
</body>
</html>
