<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F7F8F9">
  <title>Nexus Loop — one decision</title>
  <style>
    /*
      Atlassian Design System (light): sunken page, raised cards,
      radius.medium on controls, radius.large/xlarge on containers.
      Primitive → semantic → component. Hex only here. No webfonts.
      Every figure is copied from loop-report.json.
    */

    :root {
      --ds-text: #172b4d;
      --ds-text-subtle: #44546f;
      --ds-text-subtlest: #626f86;
      --ds-text-inverse: #ffffff;
      --ds-brand: #0c66e4;
      --ds-brand-hovered: #0055cc;
      --ds-brand-pressed: #09326c;
      --ds-danger: #c9372c;
      --ds-danger-hovered: #ae2e24;
      --ds-success: #1f845a;
      --ds-warning: #a54800;
      --ds-information: #0c66e4;
      --ds-surface: #ffffff;
      --ds-sunken: #f7f8f9;
      --ds-neutral: #091e420f;
      --ds-neutral-hovered: #091e4224;
      --ds-selected: #e9f2ff;
      --ds-success-bg: #dcfff1;
      --ds-danger-bg: #ffeceb;
      --ds-warning-bg: #fff7d6;
      --ds-info-bg: #e9f2ff;
      --ds-border: #091e4224;
      --ds-border-focused: #388bff;
      --ds-shadow-raised: 0 1px 1px #091e4240, 0 0 1px #091e424f;
      --ds-shadow-overlay: 0 8px 12px #091e4226, 0 0 1px #091e424f;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --radius-xs: 0.125rem;
      --radius-sm: 0.25rem;
      --radius-md: 0.375rem;
      --radius-lg: 0.5rem;
      --radius-xl: 0.75rem;
      --radius-full: 999px;
      --duration: 120ms;
      --font-sans: ui-sans-serif, system-ui, "Segoe UI", "Noto Sans", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --fs-2xs: 0.6875rem;
      --fs-xs: 0.75rem;
      --fs-sm: 0.8125rem;
      --fs-base: 0.875rem;
      --fs-lg: 1.25rem;
      --fs-xl: 1.5rem;
      --leading-tight: 1.25;
      --leading: 1.5;
      --ring: 2px;
      --ring-off: 2px;
    }
    :root {
      --color-bg: var(--ds-sunken);
      --color-fg: var(--ds-text);
      --color-surface: var(--ds-sunken);
      --color-surface-2: var(--ds-surface);
      --color-border: var(--ds-border);
      --color-muted: var(--ds-text-subtle);
      --color-accent: var(--ds-brand);
      --color-accent-hover: var(--ds-brand-hovered);
      --color-ok: var(--ds-success);
      --color-bad: var(--ds-danger);
      --color-info: var(--ds-information);
      --color-ring: var(--ds-border-focused);
      --button-bg: var(--ds-brand);
      --button-fg: var(--ds-text-inverse);
      --button-hover: var(--ds-brand-hovered);
      --button-bad-bg: var(--ds-danger);
      --button-bad-fg: var(--ds-text-inverse);
      --button-ghost-bg: var(--ds-surface);
      --button-ghost-fg: var(--ds-text);
      --input-bg: var(--ds-surface);
      --input-border: var(--ds-border);
      --input-fg: var(--ds-text);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow-x: hidden;
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-sans);
      font-size: var(--fs-base);
      line-height: var(--leading);
    }
    button, input, textarea { font: inherit; touch-action: manipulation; }
    a { color: var(--color-accent); }
    code, .mono { font-family: var(--font-mono); font-size: var(--fs-xs); }
    .num { font-variant-numeric: tabular-nums; }

    .skip {
      position: absolute; left: -999px; top: 0;
      background: var(--color-accent); color: var(--button-fg);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
    }
    .skip:focus { left: var(--space-2); top: var(--space-2); z-index: 20; }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header.top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3) var(--space-4);
      padding: var(--space-3) var(--space-5);
      border-bottom: 1px solid var(--color-border);
      background: var(--ds-surface);
      min-width: 0;
    }
    .brand-wrap { display: flex; align-items: center; gap: var(--space-2); }
    .mark {
      width: 0.75rem; height: 0.75rem;
      background: var(--ds-brand);
      border-radius: var(--radius-sm);
    }
    header.top .brand {
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
      font-size: 1rem;
    }
    header.top .meta {
      color: var(--ds-text-subtlest);
      font-size: var(--fs-xs);
    }
    header.top .spacer { flex: 1 1 0; min-width: 0; }
    .honesty {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end;
      gap: var(--space-2);
      flex: 1 1 18rem;
      min-width: 0;
      font-size: var(--fs-xs); color: var(--ds-text-subtle);
    }
    .honesty .badge { max-width: 100%; }
    .honesty details { min-width: 0; }
    .honesty details summary { cursor: pointer; color: var(--ds-brand); font-weight: 600; white-space: nowrap; }
    .honesty details .note {
      margin: var(--space-2) 0 0;
      max-width: 72ch;
      color: var(--color-fg);
      background: var(--ds-sunken);
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-4);
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(16rem, 20rem) minmax(0, 1fr) minmax(17rem, 20rem);
      gap: var(--space-4);
      padding: var(--space-4);
      min-height: 0;
      background: var(--ds-sunken);
    }
    @media (max-width: 1100px) {
      .shell { grid-template-columns: minmax(14rem, 17rem) minmax(0, 1fr); }
      .gate-col { grid-column: 1 / -1; position: static; }
    }
    @media (max-width: 720px) {
      .shell { grid-template-columns: 1fr; padding: var(--space-2); }
      .list-col { max-height: 14rem; }
    }

    .list-col {
      background: var(--ds-surface);
      overflow-x: hidden;
      overflow-y: auto;
      min-width: 0;
      border: 1px solid var(--ds-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--ds-shadow-raised);
    }
    .list-head {
      position: sticky; top: 0; z-index: 1;
      display: flex; flex-wrap: wrap; gap: var(--space-1);
      padding: var(--space-2);
      margin: var(--space-2);
      background: var(--ds-neutral);
      border-radius: var(--radius-lg);
      border-bottom: 0;
    }
    .seg {
      appearance: none; border: 0; cursor: pointer;
      background: transparent;
      color: var(--ds-text-subtle);
      font-size: var(--fs-xs);
      font-weight: 600;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      white-space: nowrap;
      flex: 1 1 auto;
    }
    .seg:hover { background: var(--ds-surface); color: var(--ds-text); }
    .seg.is-on { background: var(--ds-surface); color: var(--ds-text); box-shadow: var(--ds-shadow-raised); }
    .seg:focus-visible {
      outline: none;
      box-shadow: 0 0 0 var(--ring) var(--ds-border-focused);
    }
    .trace {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: var(--space-3);
      align-items: start;
      width: calc(100% - 1rem);
      margin: 0 var(--space-2) var(--space-1);
      text-align: left;
      border: 1px solid transparent;
      border-radius: var(--radius-lg);
      background: transparent;
      color: inherit;
      padding: var(--space-3);
      cursor: pointer;
    }
    .trace:hover { background: var(--ds-neutral-hovered); }
    .trace.is-on {
      background: var(--ds-selected);
      border-color: transparent;
      box-shadow: inset 3px 0 0 var(--ds-brand);
    }
    .trace:focus-visible {
      outline: none;
      box-shadow: 0 0 0 var(--ring) var(--ds-border-focused);
    }
    .trace.is-on:focus-visible {
      box-shadow: inset 3px 0 0 var(--ds-brand), 0 0 0 var(--ring) var(--ds-border-focused);
    }
    .dot {
      width: 0.5rem; height: 0.5rem; min-height: 0;
      margin-top: 0.4rem;
      border-radius: var(--radius-full);
      background: var(--ds-text-subtlest);
    }
    .dot.bad { background: var(--ds-danger); }
    .dot.warn { background: var(--ds-warning); }
    .dot.ok { background: var(--ds-success); }
    .dot.miss { background: var(--ds-brand); }
    .t-main { min-width: 0; overflow: hidden; }
    .t-title {
      display: block;
      font-size: var(--fs-sm);
      font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .t-sub {
      display: block;
      font-size: var(--fs-2xs);
      color: var(--color-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .t-stat {
      font-size: var(--fs-2xs);
      color: var(--color-muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .detail {
      overflow: auto;
      overflow-x: hidden;
      min-width: 0;
      padding: var(--space-5) var(--space-5) var(--space-8);
      background: var(--ds-surface);
      border: 1px solid var(--ds-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--ds-shadow-raised);
    }
    .path {
      font-family: var(--font-mono);
      font-size: var(--fs-2xs);
      color: var(--ds-text-subtlest);
      margin: 0 0 var(--space-2);
    }
    h1.claim {
      font-size: var(--fs-xl);
      line-height: var(--leading-tight);
      font-weight: 600;
      letter-spacing: -0.02em;
      text-wrap: pretty;
      margin: 0 0 var(--space-3);
      color: var(--ds-text);
    }
    .chips { display: flex; flex-wrap: wrap; gap: var(--space-1); margin: 0 0 var(--space-4); }
    .badge {
      display: inline-flex; align-items: center;
      font-size: var(--fs-2xs);
      font-weight: 600;
      border: 0;
      background: var(--ds-neutral);
      color: var(--ds-text-subtle);
      border-radius: var(--radius-sm);
      padding: 0.15rem 0.5rem;
    }
    .badge.bad { color: var(--ds-danger); background: var(--ds-danger-bg); }
    .badge.ok { color: var(--ds-success); background: var(--ds-success-bg); }
    .badge.warn { color: var(--ds-warning); background: var(--ds-warning-bg); }
    .badge.ghost { color: var(--ds-text-subtlest); background: var(--ds-neutral); }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
      gap: var(--space-3);
      margin: 0 0 var(--space-5);
    }
    @media (max-width: 860px) { .kpis { grid-template-columns: 1fr 1fr; } }
    .kpi {
      border: 1px solid var(--ds-border);
      background: var(--ds-sunken);
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-4);
      min-width: 0;
    }
    .kpi .k { font-size: var(--fs-2xs); color: var(--ds-text-subtlest); }
    .kpi .v {
      font-size: var(--fs-lg);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
      color: var(--ds-text);
    }
    .kpi .s { font-size: var(--fs-2xs); color: var(--ds-text-subtlest); }

    .lede { margin: 0 0 var(--space-2); max-width: 68ch; }
    .defn { margin: 0 0 var(--space-5); max-width: 68ch; font-size: var(--fs-xs); color: var(--ds-text-subtle); }
    .lead-ev {
      margin: 0 0 var(--space-4);
      max-width: 68ch;
      font-size: var(--fs-sm);
      padding: var(--space-3) var(--space-4);
      background: var(--ds-info-bg);
      border-radius: var(--radius-lg);
      border-left: 0;
    }
    .who {
      margin: 0 0 var(--space-5);
      color: var(--color-fg);
      font-size: var(--fs-base);
      max-width: 68ch;
      padding: var(--space-4);
      background: var(--ds-sunken);
      border: 0;
      border-radius: var(--radius-lg);
    }
    .who .owner { font-weight: 600; margin: 0 0 var(--space-2); }
    .who .inaction { margin: 0; }
    .tech { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: var(--space-2); padding: 0.35rem 0; border-bottom: 1px dashed var(--ds-border); font-size: var(--fs-xs); }
    .tech:last-child { border-bottom: 0; }
    .tech .tk { color: var(--ds-text-subtlest); }
    .tech code { overflow-wrap: anywhere; }

    .spans {
      border: 1px solid var(--ds-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: var(--ds-surface);
      margin: 0 0 var(--space-5);
    }
    .span {
      display: grid;
      grid-template-columns: 8.75rem minmax(0, 1fr) auto;
      gap: var(--space-3);
      align-items: center;
      padding: var(--space-4);
      border-top: 1px solid var(--ds-border);
    }
    .span:first-child { border-top: 0; }
    .span .kind {
      font-family: var(--font-sans);
      font-size: var(--fs-2xs);
      font-weight: 600;
      color: var(--ds-brand);
      line-height: 1.25;
    }
    .span .body { min-width: 0; overflow-wrap: anywhere; }
    .span .name { font-size: var(--fs-sm); font-weight: 600; }
    .span .hint { font-size: var(--fs-2xs); color: var(--ds-text-subtle); overflow-wrap: anywhere; }
    .span .val {
      font-variant-numeric: tabular-nums;
      font-size: var(--fs-xs);
      color: var(--ds-text-subtlest);
      text-align: right;
      white-space: nowrap;
    }
    .bars { display: flex; flex-direction: column; gap: 4px; margin-top: var(--space-2); max-width: 22rem; }
    .barrow { display: grid; grid-template-columns: 7.2rem 1fr 4.4rem; gap: var(--space-2); align-items: center; }
    .barrow .bl { font-size: var(--fs-2xs); color: var(--ds-text-subtlest); text-align: right; }
    .barrow .bv { font-size: var(--fs-2xs); font-variant-numeric: tabular-nums; color: var(--ds-text-subtle); }
    .track { height: 8px; background: var(--ds-neutral); border-radius: var(--radius-full); overflow: hidden; }
    .track > i { display: block; height: 100%; border-radius: var(--radius-full); background: var(--ds-brand); }
    .track > i.bad { background: var(--ds-danger); }
    .track > i.ok { background: var(--ds-success); }
    .track > i.warn { background: var(--ds-warning); }

    .alert {
      border: 0;
      background: var(--ds-sunken);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin: 0 0 var(--space-4);
    }
    .alert.miss { background: var(--ds-info-bg); color: var(--ds-text); }
    .alert.ok { background: var(--ds-success-bg); }
    .alert.bad { background: var(--ds-danger-bg); }
    .alert.warn { background: var(--ds-warning-bg); }
    .alert p { margin: 0 0 var(--space-2); }
    .alert p:last-child { margin: 0; }

    details.more {
      font-size: var(--fs-sm);
      color: var(--ds-text-subtle);
      margin: 0 0 var(--space-4);
    }
    details.more summary {
      cursor: pointer;
      color: var(--ds-brand);
      font-size: var(--fs-xs);
      list-style: none;
    }
    details.more summary::-webkit-details-marker { display: none; }
    details.more .inner {
      margin-top: var(--space-3);
      padding: var(--space-4);
      background: var(--ds-sunken);
      border-radius: var(--radius-lg);
      color: var(--color-fg);
    }
    .evidence { margin: 0; padding-left: var(--space-5); }
    .evidence li { margin: 0 0 var(--space-2); }

    .gate-col {
      background: var(--ds-surface);
      padding: var(--space-5);
      min-width: 0;
      border: 1px solid var(--ds-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--ds-shadow-overlay);
    }
    @media (max-width: 1100px) {
      .gate-col { box-shadow: var(--ds-shadow-raised); }
    }
    .gate-col .eyebrow { font-size: var(--fs-2xs); color: var(--ds-text-subtlest); margin: 0 0 var(--space-2); font-weight: 600; }
    .ask { font-size: var(--fs-sm); margin: 0 0 var(--space-3); }
    .risk { font-size: var(--fs-xs); color: var(--ds-text-subtle); margin: 0 0 var(--space-4); max-width: 40ch; }
    label.field {
      display: block;
      font-size: var(--fs-xs);
      font-weight: 600;
      margin: var(--space-3) 0 var(--space-1);
      color: var(--ds-text-subtle);
    }
    .input, textarea.input {
      width: 100%;
      background: var(--input-bg);
      color: var(--input-fg);
      border: 2px solid var(--ds-border);
      border-radius: var(--radius-md);
      min-height: 2.5rem;
      padding: var(--space-2) var(--space-3);
    }
    .input:focus, .input:focus-visible {
      outline: none;
      border-color: var(--ds-border-focused);
    }
    .input[aria-invalid="true"] { border-color: var(--ds-danger); }
    textarea.input { min-height: 5rem; resize: vertical; }
    .btn-row { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-4); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%;
      background: var(--button-bg);
      color: var(--button-fg);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      min-height: 2.25rem;
      padding: 0.375rem var(--space-4);
      font-size: var(--fs-sm);
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--button-hover); }
    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 var(--ring-off) var(--ds-surface),
                  0 0 0 calc(var(--ring-off) + var(--ring)) var(--ds-border-focused);
    }
    .btn:disabled { opacity: 0.5; pointer-events: none; }
    .btn-bad { background: var(--button-bad-bg); color: var(--button-bad-fg); }
    .btn-bad:hover { background: var(--ds-danger-hovered); }
    .btn-ghost { background: var(--ds-neutral); color: var(--ds-text); border-color: transparent; }
    .btn-ghost:hover { background: var(--ds-neutral-hovered); }
    .flash { font-size: var(--fs-xs); margin-top: var(--space-2); min-height: 1.2em; }
    .flash.err { color: var(--ds-danger); }
    .flash.ok { color: var(--ds-success); }
    .idle { color: var(--ds-text-subtle); font-size: var(--fs-sm); }

    footer.foot {
      grid-column: 1 / -1;
      font-size: var(--fs-2xs);
      color: var(--ds-text-subtlest);
      padding: var(--space-3) var(--space-5);
      background: var(--ds-sunken);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#detail">Skip to the finding</a>
  <div class="app">
    <header class="top">
      <div class="brand-wrap">
        <span class="mark" aria-hidden="true"></span>
        <h2 class="brand">Nexus Loop</h2>
      </div>
      <div class="meta" id="hdr">Loading report…</div>
      <div class="spacer"></div>
      <div class="honesty" id="honesty"></div>
    </header>
    <div class="shell">
      <nav class="list-col" id="list" aria-label="Findings"></nav>
      <article class="detail" id="detail">
        <p class="idle">Waiting for <code>loop-report.json</code>.</p>
      </article>
      <aside class="gate-col" id="gate">
        <p class="idle">A reason is required. The verdict is written back into the report.</p>
      </aside>
    </div>
    <footer class="foot" id="foot"></footer>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    };
    const fmt = (n, d = 2) => (n === null || n === undefined) ? "—" : Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
    const pct = (n) => (n === null || n === undefined) ? "—" : (100 * n).toFixed(1) + "%";
    const cohortPath = (f) => {
      const c = (f && f.cohort) || {};
      const bits = [f && f.tenant, c.intent || c.agent_id, c.tool].filter(Boolean);
      return bits.length ? "/" + bits.join("/") : "/";
    };
    const windowLbl = (w) => {
      if (!w) return "";
      const a = w.from_day, b = w.to_day;
      if (a == null && b == null) return "";
      return `days ${a ?? "—"}–${b ?? "—"}`;
    };
    const AUDIENCE = {
      agent_builder: "Agent team",
      platform_owner: "Platform team",
      business_owner: "Business owner",
    };
    const METRIC = {
      resolution_rate: "share we finished",
      turns_to_resolve: "turns to finish",
      tool_p95_latency_ms: "tool wait time",
      containment_rate: "share we handled end to end",
    };
    const CAUSE = {
      "tool.contract_break": "The tool said success but sent an empty answer",
      "kb.gap": "The knowledge base has nothing for this question",
      "prompt.regression": "The prompt started taking more turns",
      "traffic_mix": "Traffic mix, not quality",
      "load": "A short load spike",

    };
    const audienceLbl = (ids) => (ids || []).map((x) => AUDIENCE[x] || x).join(", ") || "—";

    const causeLbl = (id) => CAUSE[id] || String(id || "unknown").replace(/[._]/g, " ");
    const gapClaim = (g) => {

    };
    function techBlock(rows) {
      const bits = (rows || []).filter((r) => r && r.v != null && String(r.v) !== "");
      if (!bits.length) return "";
      return details("Technical names", bits.map((r) =>
        `<div class="tech"><span class="tk">${esc(r.k)}</span><code translate="no">${esc(r.v)}</code></div>`

    function matchStandard(rep, f) {
      if (!f) return null;

    function standardLine(s, metric) {

      const best = rate ? pct(s.best) : fmt(s.best, 1);

    const SAFE_KEY = /^(gap:[A-Z0-9]+|[A-Za-z0-9._-]+)$/;
    async function api(path, opts) {
      const ctrl = new AbortController();

      const extra = opts || {};
      const hdrs = Object.assign(
        { Accept: "application/json" },
        extra.body ? { "Content-Type": "application/json" } : {},
        extra.headers || {}
      );
      try {
        const res = await fetch(path, {
          credentials: "same-origin",
          signal: ctrl.signal,
          method: extra.method || "GET",
          headers: hdrs,
          body: extra.body,
        });
        const text = await res.text();
        let data = null;
        if (text) {
          try { data = JSON.parse(text); }
          catch { throw new Error("The server returned something we could not read."); }
        }
        if (!res.ok) {
          const msg = (data && (data.detail || data.error)) || res.statusText || "request failed";
          throw new Error(String(msg));
        }
        return data;
      } finally {
        clearTimeout(t);
      }
    }
    let selectedKey = null;
    let listFilter = "open";

    function indexes(rep) {
      const diags = Object.fromEntries((rep.diagnoses || []).map((d) => [d.id, d]));
      const byFid = Object.fromEntries((rep.diagnoses || []).map((d) => [d.finding_id, d]));
      const pres = rep.prescriptions || [];
      const vers = rep.verifications || [];
      const byDiag = {};
      pres.forEach((p) => { byDiag[p.diagnosis_id] = p; });

    }
    function packForFinding(rep, f) {
      const { byFid, byDiag, vers } = indexes(rep);
      const d = f ? byFid[f.id] : null;
      const p = d ? (byDiag[d.id] || null) : null;
      const v = (p && vers.find((x) => x.prescription_id === p.id)) || null;
      return { kind: f && f.is_regression ? "regression" : "dismissed", f, d, p, v };
    }
    function defaultFinding(rep) {
      const { diags, byFid, pres, vers } = indexes(rep);
      const findings = rep.findings || [];
      if (vers.length) {
        const p = pres.find((x) => x.id === vers[0].prescription_id);
        const d = p && diags[p.diagnosis_id];
        const f = d && findings.find((x) => x.id === d.finding_id);
        if (f) return f;
      }
      const regs = findings.filter((x) => x.is_regression);
      return regs.find((x) => (byFid[x.id] || {}).cause_class === "tool.contract_break") || regs[0] || findings[0] || null;
    }
    const ASK = {

      A09: "Gave up frustrated",
      A11: "Failover rate",
    };
    function keyFromHash() {
      try {

    function currentPack(rep) {
      if (!selectedKey) selectedKey = keyFromHash();

        const ask = selectedKey.slice(4);
        const gap = (rep.gaps || []).find((g) => g.ask_id === ask);
        if (gap) return { kind: "gap", gap };
      }
      const findings = rep.findings || [];
      const f = findings.find((x) => x.id === selectedKey) || defaultFinding(rep);

    function select(key) {

    function fidelityClass(fid) {

    function metricChip(m) {

      const cal = m.calibration || {};
      const basis = (m.coverage && m.coverage.basis) || "";
      let rest = "";
      if (fid === "judged" && cal.agreement != null) {
        rest = `agrees ${pct(cal.agreement)} (n=${esc(cal.n)})`;
      } else if (m.coverage && m.coverage.value != null) {
        rest = `coverage ${pct(m.coverage.value)}`;

      const title = [fid, basis].filter(Boolean).join(" · ");
      return `<span class="badge ${fidelityClass(fid)}" title="${esc(title)}">${esc(name)} · ${esc(fid)}${rest ? " · " + rest : ""}</span>`;
    }
    function shortNotes(notes) {
      const text = typeof notes === "string" ? notes : JSON.stringify(notes || "");
      const bits = [];
      [
        ["REAL", /REAL:\s*([\s\S]*?)(?=REAL:|STUBBED:|SIMULATED:|BREAKS AT|$)/],
        ["STUBBED", /STUBBED:\s*([\s\S]*?)(?=REAL:|STUBBED:|SIMULATED:|BREAKS AT|$)/],
        ["SIMULATED", /SIMULATED:\s*([\s\S]*?)(?=REAL:|STUBBED:|SIMULATED:|BREAKS AT|$)/],
        ["Breaks at 100×", /BREAKS AT(?: 100x)?:\s*([\s\S]*?)(?=REAL:|STUBBED:|SIMULATED:|BREAKS AT|$)/],
      ].forEach(([label, re]) => {
        const m = text.match(re);
        if (!m) return;
        let s = m[1].replace(/\s+/g, " ").trim();

    function pairBars(aLbl, aVal, bLbl, bVal, aCls, bCls) {

    function filterForPack(pack) {

    function renderGate(pack) {
      if (pack.kind === "gap" || pack.kind === "dismissed" || !pack.p) {
        $("gate").innerHTML = `<p class="idle">${pack.kind === "gap" ? "Nothing to approve — we would not guess this number." : pack.kind === "dismissed" ? "Nothing to change — this is not a problem." : "Nothing to approve on this finding."}</p>`;
        return;
      }
      const p = pack.p;
      const dec = p.decision || {};
      const a = p.approval || {};
      const recCls = a.verdict === "accepted" ? "ok" : a.verdict === "rejected" ? "bad" : a.verdict === "deferred" ? "warn" : "";
      const recorded = a.verdict ? `<div class="alert ${recCls}"><p><strong>Recorded ${esc(a.verdict)}</strong></p><p>${esc(a.reason || "")}</p></div>` : "";
      const risk = (dec.risk_if_diagnosis_wrong || "").trim();
      const riskLine = risk.length > 160 ? risk.slice(0, 157) + "…" : risk;
      $("gate").innerHTML = `
        <p class="eyebrow">Your decision</p>
        ${recorded}
        <p class="ask">${esc(dec.asking_approval_for || "")}</p>
        ${riskLine ? `<p class="risk"><strong>If we are wrong.</strong> ${esc(riskLine)}</p>` : ""}
        ${details("Full risk and when we would not ship",
          `<p><strong>Risk.</strong> ${esc(dec.risk_if_diagnosis_wrong || "—")}</p>
           <p><strong>Would not ship if.</strong> ${esc(dec.would_not_ship_if || "—")}</p>`)}
        <form id="decform">
          <input type="hidden" name="decided_by" value="operator">
          <label class="field" for="why">Reason</label>
          <textarea class="input" id="why" name="reason" required maxlength="4000" autocomplete="off" placeholder="Why you are making this call…"></textarea>
          <div class="btn-row">
            <button class="btn" type="submit" name="verdict" value="accepted">Accept</button>
            <button class="btn btn-bad" type="submit" name="verdict" value="rejected">Reject</button>
            <button class="btn btn-ghost" type="submit" name="verdict" value="deferred">Defer</button>
          </div>
          <div class="flash" id="flash" role="status" aria-live="polite"></div>
        </form>`;
      $("decform").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const verdict = (ev.submitter && ev.submitter.value) || fd.get("verdict");
        const why = $("why");
        if (!(fd.get("reason") || "").trim()) {
          why.setAttribute("aria-invalid", "true");
          $("flash").className = "flash err";
          $("flash").textContent = "A reason is required.";
          why.focus();
          return;
        }
        why.setAttribute("aria-invalid", "false");
        const payload = {
          prescription_id: p.id,
          verdict,
          decided_by: fd.get("decided_by") || "operator",
          reason: fd.get("reason"),
        };
        const buttons = ev.target.querySelectorAll("button");
        buttons.forEach((b) => { b.disabled = true; });
        $("flash").className = "flash";
        $("flash").textContent = "Saving…";
        try {
          await api("/decision", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          const next = await api("/report.json");
          window.__rep = next;
          render(next);
        } catch (e) {
          $("flash").className = "flash err";
          $("flash").textContent = String(e.message || e);
          why.setAttribute("aria-invalid", "true");
          buttons.forEach((b) => { b.disabled = false; });
        }
      });
    }

    function render(rep, opts) {
      $("hdr").textContent = `${rep.team || "—"} · ${rep.corpus || "—"}`;
      renderHonesty(rep);
      const pack = currentPack(rep);
      if (pack.kind === "gap") select("gap:" + (pack.gap && pack.gap.ask_id));
      else if (pack.f) select(pack.f.id);
      if (opts && opts.alignFilter) listFilter = filterForPack(pack);
      renderList(rep);
      renderDetail(rep, pack);
      renderGate(pack);
      $("foot").textContent = "Every figure is copied from the report. Your decision is written into the report.";
    }

    window.addEventListener("hashchange", () => {
      selectedKey = keyFromHash();
      if (window.__rep) render(window.__rep, { alignFilter: true });
    });

    api("/report.json").then((rep) => {
      window.__rep = rep;
      render(rep, { alignFilter: true });
    }).catch((e) => {
      $("detail").innerHTML = `<p>${esc(e.message)}</p>`;
    });
  </script>
</body>
</html>
